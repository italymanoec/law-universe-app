['z2','zong','行為能力','§12、§13、§15','滿18歲為成年（2023/1/1施行）。未滿7歲無行為能力；7歲以上未成年人為限制行為能力；受監護宣告之人無行為能力。'],

['z4','zong','法人','§25–§65','社團法人與財團法人；董事對外代表法人。法人對董事等有代表權人執行職務所加於他人之損害，與行為人連帶負責（§28）。'],
['z5','zong','意思表示','§86、§87、§98','心中保留原則有效，相對人明知者無效（§86）。通謀虛偽意思表示無效，但不得對抗善意第三人（§87）。解釋意思表示應探求當事人真意，不得拘泥於所用辭句（§98）。'],
['z6','zong','錯誤與誤傳','§88–§91','內容錯誤、表示錯誤得撤銷（須非表意人自己過失）；動機錯誤原則不得撤銷，但當事人資格或物之性質交易上認為重要者，視為內容錯誤（§88 II）。誤傳準用（§89）。自意思表示後1年消滅（§90）。撤銷者對非因過失而信其有效之相對人負賠償責任（§91）。','內容表示可撤、動機原則不行'],
['z7','zong','詐欺與脅迫','§92、§93','被詐欺或脅迫而為意思表示得撤銷。第三人詐欺，以相對人明知或可得而知者為限。詐欺之撤銷不得對抗善意第三人，脅迫則可。除斥期間：發見詐欺或脅迫終止後1年、意思表示後10年。','詐欺護善意、脅迫不護'],
['z8','zong','法律行為之無效與暴利','§71–§74、§111','違反強制或禁止規定無效；背於公共秩序或善良風俗無效；不依法定方式無效。乘他人急迫、輕率或無經驗，使為財產上給付顯失公平者，法院得因聲請撤銷或減輕（§74，行為後1年內）。法律行為一部無效者全部無效，但除去該部分亦可成立者，其他部分仍有效（§111）。'],
['z9','zong','條件與期限','§99–§102','停止條件成就時發生效力；解除條件成就時失其效力。因條件成就而受不利益之當事人，以不正當行為阻其成就者，視為條件已成就（§101 I）；反之視為不成就（§101 II）。'],
['z10','zong','代理','§103–§108','顯名主義，效力直接歸屬本人。代理人所為或所受意思表示，不因其為限制行為能力人而受影響（§104）。自己代理、雙方代理原則禁止，但經本人許諾或專為履行債務者不在此限（§106）。'],

['z16','zong','人格權','§18、§19、§195','人格權受侵害時，得請求法院除去其侵害；有受侵害之虞時，得請求防止（§18 I）。損害賠償或慰撫金以法律有特別規定者為限（§18 II，如§195）。姓名權另有§19保護。'],
['z17','zong','物（主物與從物）','§66–§70','不動產為土地及其定著物（§66）。從物須非主物之成分、常助主物之效用且同屬一人（§68 I），主物之處分及於從物（§68 II）。孳息歸屬見§69、§70。'],
['z18','zong','住所','§20–§24','依一定事實足認以久住之意思住於一定地域者，即為設定住所於該地（§20）。無行為能力人及限制行為能力人以其法定代理人之住所為住所（§21）。因特定行為選定居所者，關於其行為視為住所（§23）。'],

['c1','zhai','契約之成立','§153–§163','當事人互相表示意思一致，契約即為成立。貨物標定賣價陳列者視為要約，但價目表之寄送不視為要約（§154 II）。遲到之承諾視為新要約（§160）。'],
['c2','zhai','締約上過失','§245-1','契約未成立時，當事人為準備或商議訂立契約，而有惡意隱匿重要事項、洩漏秘密等顯然違反誠信之情形，對非因過失而信契約能成立致受損害之他方，負賠償責任；2年間不行使而消滅。'],
['c3','zhai','無因管理','§172–§178','未受委任並無義務而為他人管理事務。適法管理得請求償還必要或有益費用、清償負擔債務、賠償損害（§176）。不適法管理，本人仍得享有管理所得利益（§177 I）；明知為他人事務而為自己利益管理者準用（不法管理，§177 II）。經本人承認適用委任規定（§178）。'],
['c4','zhai','不當得利','§179–§183','無法律上之原因而受利益，致他人受損害者應返還。分給付型與非給付型。善意受領人所受利益不存在者免返還（§182 I）。§180不得請求：履行道德上義務、清償期前清償、明知無給付義務而清償、不法原因給付（不法僅在受領人一方者除外）。','受益・受損・無原因'],
['c5','zhai','一般侵權行為','§184','I前段：因故意或過失不法侵害他人之權利。I後段：故意以背於善良風俗之方法加損害於他人（可涵蓋純粹經濟上損失）。II：違反保護他人之法律致生損害，推定其有過失。','三個獨立請求權基礎'],
['c6','zhai','特殊侵權行為','§185–§191-3','共同侵權連帶責任（§185）；法定代理人責任（§187）；僱用人責任，賠償後得向受僱人求償（§188）；工作物所有人（§191）；商品製造人（§191-1）；動力車輛駕駛人（§191-2）；危險工作或活動（§191-3）。'],
['c7','zhai','侵權請求權時效','§197','自請求權人知有損害及賠償義務人時起2年，自侵權行為時起逾10年者亦同。時效完成後，賠償義務人因侵權行為受有利益者，仍應依不當得利規定返還（§197 II）。'],
['c8','zhai','損害賠償之範圍與方法','§213–§218-1','回復原狀為原則（§213）。範圍含所受損害及所失利益（§216）。被害人與有過失，法院得減輕或免除（§217）。非財產上損害以法律有特別規定者為限（§18 II、§195）。'],
['c9','zhai','給付不能','§225、§226','不可歸責於債務人：免給付義務，債權人得請求讓與損害賠償請求權或交付所受賠償物（代償請求權，§225 II）。可歸責：債權人得請求損害賠償；一部不能而其他部分之履行於債權人無利益時，得請求全部不履行之損害賠償。'],
['c10','zhai','給付遲延','§229–§233','有確定期限者，自期限屆滿時起負遲延責任。遲延中對不可抗力而生之損害亦應負責（§231 II）。金錢債務得請求依法定利率計算之遲延利息（§233）。'],
['c11','zhai','不完全給付','§227、§227-1','可歸責而為不完全給付，依給付遲延或給付不能規定行使權利；因不完全給付而生前項以外之損害（加害給付），並得請求賠償。侵害人格權者準用§192–§195、§197（§227-1）。'],
['c12','zhai','情事變更','§227-2','契約成立後，情事變更非當時所得預料，而依其原有效果顯失公平者，當事人得聲請法院增、減其給付或變更其他原有之效果。'],
['c13','zhai','雙務契約與危險負擔','§264–§267','同時履行抗辯（§264）；先為給付者於他方財產顯形減少時之不安抗辯（§265）。雙方均不可歸責之給付不能，他方免為對待給付（§266）；因可歸責於他方致不能者，仍得請求對待給付（§267）。'],
['c14','zhai','契約之解除','§254–§263','給付遲延須定相當期限催告（§254），定期行為得不催告（§255）；給付不能得逕行解除（§256）。解除後雙方負回復原狀義務（§259）。解除權之行使不妨礙損害賠償請求（§260）。'],
['c15','zhai','連帶債務','§272–§282','以當事人明示或法律規定者為限（§272）。債權人得對一人、數人或全體同時或先後請求全部或一部給付（§273）。內部平均分擔，清償者得向他債務人求償（§280、§281）。'],
['c16','zhai','債權讓與與債務承擔','§294–§306','債權讓與非經讓與人或受讓人通知債務人，對債務人不生效力（§297）；債務人得以對抗讓與人之事由對抗受讓人（§299）。第三人與債務人約定承擔債務，非經債權人承認對債權人不生效力（§301）。'],
['c17','zhai','債之消滅','§309–§344','清償、提存、抵銷、免除、混同。抵銷須二人互負債務、給付種類相同、均屆清償期（§334）；抵銷溯及最初得抵銷時消滅（§335）。','清、提、抵、免、混'],
['c18','zhai','定金與違約金','§248–§253','收受定金推定契約成立（§248）。付定金方不履行，定金不得請求返還；受定金方不履行，加倍返還（§249）。違約金原則為損害賠償總額預定（§250 II），過高者法院得酌減（§252）。','付方丟定金、收方還兩倍'],
['c19','zhai','代位權與撤銷權','§242–§245','債務人怠於行使其權利時，債權人得以自己名義行使（§242）。債務人無償行為有害債權者得聲請撤銷；有償行為須債務人行為時明知且受益人受益時亦知其情事（§244）。'],
['c20','zhai','債務人之注意義務','§220–§224','債務人就故意或過失之行為負責；過失之責任依事件之特性酌定，事件非予債務人利益者應從輕酌定（§220）。應與處理自己事務為同一注意者，有重大過失仍應負責（§223）。債務人之代理人或使用人關於債之履行有故意或過失時，債務人應與自己之故意或過失負同一責任（§224）。','輕過失看注意程度，使用人過失算自己'],

['g1','ge','買賣','§345–§348、§367','當事人約定一方移轉財產權於他方、他方支付價金之契約。出賣人負交付並使取得所有權之義務（§348）；買受人負交付價金及受領標的物之義務（§367）。出賣他人之物，買賣契約（負擔行為）仍有效。'],
['g2','ge','權利瑕疵擔保','§349–§353','出賣人應擔保第三人就買賣標的物對買受人不得主張任何權利。出賣人不履行此義務者，買受人得依債務不履行規定行使權利（§353）。'],
['g3','ge','物之瑕疵擔保','§354–§365','危險移轉時，應擔保物無滅失或減少價值、通常效用或契約預定效用之瑕疵，並具保證品質。買受人應從速檢查並通知（§356）。得解除契約或請求減少價金（§359）；欠缺保證品質或故意不告知瑕疵者，得請求不履行之損害賠償（§360）。通知後6個月或交付後5年消滅（§365）。'],
['g4','ge','買賣之危險負擔','§373、§374','標的物之利益及危險，自交付時起由買受人承受負擔。買受人請求將標的物送交清償地以外處所者，自出賣人交付運送人時起負擔危險。'],
['g5','ge','贈與','§406–§420','贈與物之權利未移轉前，贈與人得撤銷其贈與；經公證或為履行道德上義務者不得撤銷（§408）。受贈人對贈與人等有故意侵害之行為依刑法有處罰明文、或對贈與人有扶養義務而不履行者，贈與人得撤銷（§416）。'],
['g6','ge','租賃','§421–§463-1','不動產租賃期限逾1年者應以字據訂立，未以字據訂立者視為不定期租賃（§422）。出租人負修繕義務（§429）。承租人非經出租人承諾不得轉租，但房屋得將一部分轉租（§443）。'],
['g7','ge','買賣不破租賃','§425','出租人於租賃物交付後、承租人占有中，縱將其所有權讓與第三人，租賃契約對受讓人仍繼續存在。未經公證之不動產租賃，期限逾5年或未定期限者不適用。'],
['g8','ge','基地租賃與優先承買','§425-1、§426-2','土地與房屋同屬一人，而將土地及房屋分開、同時或先後讓與不同人時，推定在房屋得使用期限內有租賃關係（§425-1）。租用基地建築房屋者，基地出賣時承租人有依同樣條件優先承買之權（§426-2）。'],
['g9','ge','消費借貸','§474–§481','一方移轉金錢或其他代替物之所有權於他方，他方以種類、品質、數量相同之物返還。通說認屬要物契約；約定貸與者為預約（§475-1）。'],
['g10','ge','承攬','§490–§514','完成一定工作，他方俟工作完成給付報酬。瑕疵修補請求（§493）；不修補者得解除契約或請求減少報酬（§494）。建築物承攬人得請求定作人為抵押權登記或預為登記（§513）。'],
['g11','ge','委任','§528–§552','委託他方處理事務。有償者應以善良管理人之注意為之；無償者應與處理自己事務為同一注意（§535）。當事人得隨時終止，但於不利於他方之時期終止者應賠償損害（§549）。'],
['g12','ge','保證','§739–§756-9','保證債務具從屬性。保證人於債權人未就主債務人財產強制執行而無效果前，得拒絕清償（先訴抗辯權，§745）；拋棄等情形不得主張（§746）。保證人清償後，於清償限度內承受債權人之權利（§749）。'],
['g13','ge','合會','§709-1–§709-9','會首與會員約定交付會款、標取合會金之契約。會首及會員以自然人為限，會首不得兼為同一合會之會員（§709-2）。會首破產、逃匿致合會不能繼續時，會首及已得標會員應給付之各期會款，於每屆標會期日平均交付未得標會員，會首就已得標會員應給付部分負連帶責任（§709-9）。'],
['g14','ge','居間','§565–§575','一方為他方報告訂約機會或為訂約之媒介，他方給付報酬。居間人以契約因其報告或媒介而成立者為限，得請求報酬（§568）。不動產仲介實務常考。'],
['g15','ge','合夥','§667–§699','二人以上互約出資以經營共同事業之契約（§667）。合夥財產為合夥人全體公同共有（§668）。合夥財產不足清償合夥債務時，各合夥人對不足之額連帶負責（§681，補充連帶）。加入合夥者對加入前之合夥債務亦負同一責任（§691 II）。','先用合夥財產，不足才連帶'],

['w1','wu','物權法定主義','§757','物權除依法律或習慣外，不得創設。'],
['w2','wu','不動產物權變動','§758','依法律行為而取得、設定、喪失及變更者，非經登記不生效力；前項行為應以書面為之。登記生效要件主義。','登記＋書面'],
['w3','wu','非因法律行為之取得','§759','因繼承、強制執行、徵收、法院判決或其他非因法律行為，於登記前已取得不動產物權者，應經登記始得處分其物權。'],
['w4','wu','登記公信力','§759-1','不動產物權經登記者，推定登記權利人適法有此權利。因信賴不動產登記之善意第三人，已依法律行為為物權變動之登記者，其變動之效力不因原登記物權之不實而受影響。'],
['w5','wu','動產物權變動','§761','動產物權之讓與，非將動產交付不生效力。交付方式：現實交付、簡易交付、占有改定、指示交付。'],
['w6','wu','所有權與物上請求權','§765、§767','所有人對無權占有或侵奪其所有物者得請求返還；妨害所有權者得請求除去；有妨害之虞者得請求防止。已登記不動產之返還、除去請求權，不適用消滅時效（釋字107、164）。','返還、除去、防止'],
['w7','wu','取得時效','§768–§772','動產：以所有之意思10年間和平公然繼續占有，取得所有權；占有之始善意並無過失者5年。不動產（未登記）：20年得請求登記為所有人；占有之始善意無過失者10年（§769、§770）。'],
['w8','wu','相鄰關係','§774–§800','袋地所有人得通行周圍地（§787）。越界建築，鄰地所有人知其越界而不即提出異議者，不得請求移去或變更（§796）。'],
['w9','wu','善意取得','§801、§948–§951','以動產所有權移轉為目的而善意受讓占有者，縱讓與人無讓與之權利，仍取得所有權；受讓人明知或因重大過失而不知者除外。盜贓或遺失物，原占有人得自喪失占有時起2年內請求回復（§949）；於公開交易場所等善意買得者，非償還其支出之價金不得回復（§950）。','善意＋有償受讓占有'],
['w10','wu','添附','§811–§816','附合、混合、加工。因添附喪失權利而受損害者，得依關於不當得利之規定請求償還價額（§816）。'],
['w11','wu','分別共有','§817–§826-1','共有物之處分、變更及設定負擔應得全體同意（§819 II），但不動產得依土地法§34-1多數決。管理依§820多數決。共有人得隨時請求分割（§823），分割方法見§824。不動產分管約定經登記者對應有部分受讓人具效力（§826-1）。'],
['w12','wu','公同共有','§827–§831','依法律規定、習慣或法律行為成一公同關係之數人，基於其公同關係而共有一物。權利之行使除法律或契約另有規定外，應得全體同意。遺產、合夥財產為典型。'],
['w13','wu','區分所有建物','§799、§799-1','專有部分與共有部分；專有部分與其所屬之共有部分及基地權利不得分離而為移轉或設定負擔（§799 V）。規約對繼受人亦有效力。'],
['w14','wu','地上權','§832–§841-6','以在他人土地之上下有建築物或其他工作物為目的而使用其土地之權。另有區分地上權（§841-1）。'],
['w15','wu','普通抵押權','§860–§881','對債務人或第三人不移轉占有而供其債權擔保之不動產，得就其賣得價金優先受償。具從屬性、不可分性。抵押物讓與他人，抵押權不因此受影響（§867）。流抵約定非經登記不得對抗第三人（§873-1）。'],
['w16','wu','法定地上權','§876','設定抵押權時，土地及其土地上之建築物同屬一人所有，而僅以土地或僅以建築物為抵押者，於抵押物拍賣時，視為已有地上權之設定；同時抵押而拍定人各異者亦同。'],
['w17','wu','最高限額抵押權','§881-1–§881-17','債務人或第三人提供不動產，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權。'],
['w18','wu','質權','§884–§910','動產質權：債權人占有債務人或第三人移交之動產，得就其賣得價金優先受償。另有權利質權。'],
['w19','wu','留置權','§928–§939','債權人占有他人之動產，其債權之發生與該動產有牽連關係，於債權已屆清償期未受清償時，得留置該動產。'],
['w20','wu','占有','§940–§966','對物有事實上管領力者為占有人。占有人得請求返還占有物、除去妨害、防止妨害（§962），自侵奪或妨害發生後1年間不行使而消滅（§963）。占有人得為自力救濟（§960）。'],

['q1','qin','婚約','§972–§979-1','婚約應由男女當事人自行訂定。婚約不得請求強迫履行（§975）。'],
['q2','qin','結婚','§980–§999-1','男女未滿18歲者不得結婚（§980，2023施行）。應以書面為之，有二人以上證人之簽名，並向戶政機關為結婚登記（§982）。重婚無效（§985、§988）。','書面・二證人・登記'],
['q3','qin','夫妻財產制','§1003-1–§1048','未以契約訂立夫妻財產制者，以法定財產制為其夫妻財產制（§1005）。法定財產制下，夫或妻之財產由各自所有、管理、使用收益及處分（§1018）。家庭生活費用依經濟能力、家事勞動或其他情事分擔（§1003-1）。'],
['q4','qin','剩餘財產分配','§1030-1','法定財產制關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續中所負債務後，如有剩餘，其雙方差額應平均分配。因繼承或其他無償取得之財產、慰撫金不列入。知有差額時起2年、關係消滅時起5年。'],
['q5','qin','離婚','§1049–§1058','兩願離婚應以書面為之，有二人以上證人簽名並向戶政機關為離婚之登記（§1050）。裁判離婚：§1052 I 十款事由，II 難以維持婚姻之重大事由；II但書「唯一有責」限制經112年憲判字第4號宣告部分違憲。'],
['q6','qin','婚生推定與否認','§1063','妻之受胎係在婚姻關係存續中者，推定其所生子女為婚生子女。夫妻之一方或子女得提起否認之訴，自知悉非婚生子女時起2年內為之。'],
['q7','qin','親權','§1084–§1090','父母為其未成年子女之法定代理人（§1086）。子女之特有財產由父母共同管理，父母有使用收益之權，但非為子女之利益不得處分（§1088）。'],
['q8','qin','收養','§1072–§1083-1','收養者之年齡應長於被收養者20歲以上（§1073）。收養應以書面為之，並向法院聲請認可（§1079）。養子女與養父母之關係，除法律另有規定外，與婚生子女同（§1077）。'],
['q9','qin','監護與輔助','§1091–§1113-10','未成年人無父母或父母均不能行使親權時應置監護人（§1091）。成年人之監護宣告（§14）與輔助宣告（§15-1）。'],
['q10','qin','扶養','§1114–§1121','直系血親相互間等負扶養義務。受扶養權利者以不能維持生活而無謀生能力者為限；直系血親尊親屬不受無謀生能力之限制（§1117）。'],

['j1','ji','法定繼承人順序','§1138','配偶以外：直系血親卑親屬 → 父母 → 兄弟姊妹 → 祖父母。配偶有相互繼承遺產之權，與各順序共同繼承。','卑、父母、兄弟、祖'],
['j2','ji','應繼分','§1144','配偶與第一順序同為繼承時，按人數平均；與第二、三順序同為繼承時為1/2；與第四順序同為繼承時為2/3；無前述繼承人時為遺產全部。','均分、半、三分之二、全'],
['j3','ji','代位繼承','§1140','第一順序之繼承人，有於繼承開始前死亡或喪失繼承權者，由其直系血親卑親屬代位繼承其應繼分。拋棄繼承不發生代位。'],
['j4','ji','繼承權之喪失','§1145','故意致被繼承人或應繼承人於死或雖未致死因而受刑之宣告、以詐欺脅迫使被繼承人為或不為關於繼承之遺囑、對被繼承人有重大之虐待或侮辱經其表示不得繼承等。部分事由經被繼承人宥恕者不喪失。'],
['j5','ji','繼承回復請求權','§1146','繼承權被侵害者，被害人或其法定代理人得請求回復之。自知悉被侵害之時起2年間不行使而消滅；自繼承開始時起逾10年者亦同。'],
['j6','ji','概括繼承有限責任','§1148、§1148-1','繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任。繼承開始前2年內，從被繼承人受有財產之贈與者，該財產視為其所得遺產（§1148-1）。'],
['j7','ji','遺產公同共有與分割','§1151、§1164、§1173','繼承人有數人時，在分割遺產前，各繼承人對於遺產全部為公同共有。繼承人得隨時請求分割遺產（§1164）。因結婚、分居或營業而受之特種贈與應歸扣（§1173）。'],
['j8','ji','拋棄繼承','§1174','應於知悉其得繼承之時起3個月內，以書面向法院為之。'],
['j9','ji','遺囑','§1186–§1222','未滿16歲者不得為遺囑（§1186）。法定方式：自書、公證、密封、代筆、口授（§1189）。','自、公、密、代、口'],
['j10','ji','特留分','§1223、§1225','直系血親卑親屬、父母、配偶之特留分為其應繼分1/2；祖父母為1/3。兄弟姊妹之特留分已於115.08.17公布修正刪除，2027-02-17 施行；以被繼承人死亡日判斷：該日前開始的繼承仍適用舊法（兄弟姊妹特留分為應繼分1/3），之後開始的繼承，遺囑可以不留給兄弟姊妹（兄弟姊妹仍是第三順序法定繼承人）。應得特留分之人，因遺贈致其應得之數不足者，得按其不足之數由遺贈財產扣減之（§1225）。']

,['c20','zhai','懸賞廣告','§164–§165-4','對完成一定行為之人負給付報酬義務（§164 I）。數人先後完成由最先完成者取得報酬；廣告人善意給付最先通知者即免責（§164 II、III），最先完成者改向受領人依不當得利請求。行為完成前撤回，須賠償善意行為人（§165）。']

['cr_5','cr_b','過失','§14','應注意、能注意而不注意為無認識過失；預見能發生而確信其不發生為有認識過失。處罰過失以有特別規定者為限（§12 II）。','間接故意vs有認識過失：不違本意vs確信不發生'],
['cr_6','cr_b','不作為犯','§15','對結果發生法律上有防止義務，能防止而不防止者，與積極行為同。保證人地位來源：法令、契約、危險前行為（§15 II）、緊密生活共同體。'],
['cr_7','cr_b','因果關係與客觀歸責','實務：相當因果關係','實務採相當因果關係說；學說採條件理論＋客觀歸責（製造法所不容許之風險、風險實現、構成要件效力範圍）。'],
['cr_8','cr_b','構成要件錯誤','實務與學說','客體錯誤（等價不影響故意）與打擊錯誤（通說：未遂＋過失想像競合）。容許構成要件錯誤（誤想防衛）通說阻卻故意罪責或故意。'],
['cr_9','cr_b','禁止錯誤','§16','除有正當理由而無法避免者外，不得因不知法律而免除刑事責任，但按其情節得減輕其刑。採責任理論：影響罪責，不影響故意。'],
['cr_10','cr_c','正當防衛','§23','對現在不法之侵害，出於防衛自己或他人權利之行為，不罰。須有防衛意思；防衛過當得減輕或免除其刑。','現在・不法・防衛意思・必要'],
['cr_11','cr_c','緊急避難','§24','因避免自己或他人生命、身體、自由、財產之緊急危難而出於不得已之行為，不罰；過當者得減免。公務上或業務上有特別義務者不適用（§24 II）。'],
['cr_12','cr_c','依法令與業務上正當行為','§21、§22','依法令之行為（如現行犯逮捕）、依所屬上級公務員命令之職務上行為（明知違法者除外）、業務上之正當行為，不罰。被害人承諾為超法規阻卻違法事由。'],
['cr_13','cr_c','責任能力','§18、§19','未滿14歲不罰；14至18歲、滿80歲得減輕。精神障礙致不能辨識違法或欠缺控制能力者不罰，顯著減低者得減輕；自行招致者不適用（原因自由行為，§19 III）。'],
['cr_14','cr_d','普通未遂','§25','已著手於犯罪行為之實行而不遂。處罰以有特別規定者為限，得按既遂犯之刑減輕。著手判斷實務採主客觀混合理論。'],
['cr_15','cr_d','不能未遂','§26','行為不能發生犯罪之結果，又無危險者，不罰（2005年修正改為不罰）。「無危險」採重大無知說。'],
['cr_16','cr_d','中止未遂','§27','已著手而因己意中止或防止結果發生者，減輕或免除其刑；結果不發生非防止行為所致而已盡力防止者亦同（準中止）。共同正犯之中止須防止全部結果。'],
['cr_17','cr_d','共同正犯','§28','二人以上共同實行犯罪之行為者，皆為正犯。實務：以自己犯罪之意思參與、有犯意聯絡與行為分擔（含共謀共同正犯，釋字109號）。'],
['cr_18','cr_d','教唆犯','§29','教唆他人使之實行犯罪行為者，依其所教唆之罪處罰。採限制從屬性，被教唆者未實行時教唆犯不成立（教唆未遂不罰）。'],
['cr_19','cr_d','幫助犯','§30','幫助他人實行犯罪行為者，雖他人不知幫助之情亦同；得按正犯之刑減輕。以正犯已著手實行為前提。'],
['cr_20','cr_d','身分犯與共犯','§31','純正身分犯：無身分者共同實行、教唆或幫助，仍以正犯或共犯論，但得減輕（§31 I）。不純正身分犯：無身分者科以通常之刑（§31 II）。'],
['cr_21','cr_e','想像競合與法條競合','§55','一行為觸犯數罪名，從一重處斷，但不得科以較輕罪名最輕本刑以下之刑。法條競合只適用一罪（特別、補充、吸收關係）。牽連犯、連續犯已於2005年刪除。'],
['cr_22','cr_e','數罪併罰','§50–§54','裁判確定前犯數罪者併合處罰，依§51定應執行刑（有期徒刑合併不得逾30年）。得易科與不得易科之罪併罰時，受刑人得請求定應執行刑（§50 II）。'],
['cr_23','cr_e','易科罰金與易服社會勞動','§41','最重本刑五年以下之罪，受六個月以下有期徒刑或拘役之宣告者，得以每日新臺幣一千、二千或三千元易科罰金；不得易科者得易服社會勞動。'],
['cr_24','cr_e','緩刑','§74–§76','受二年以下有期徒刑、拘役或罰金之宣告，符合未曾受有期徒刑以上刑之宣告等要件者，得宣告二年以上五年以下緩刑，並得附負擔（§74 II）。'],
['cr_25','cr_e','累犯','§47','受徒刑之執行完畢或一部執行而赦免後，五年以內故意再犯有期徒刑以上之罪，加重本刑至二分之一。釋字775號：不得一律加重，法院應個案裁量。'],
['cr_26','cr_e','沒收新制','§38–§38-3','沒收為獨立之法律效果（2016年施行）。違禁物、犯罪工具與產物（§38）；犯罪所得（§38-1）含第三人取得者，不能沒收時追徵；過苛得不宣告（§38-2 II）。'],
['cr_27','cr_e','追訴權時效','§80–§83','依最重本刑定期間（30年、20年、10年、5年）；最重本刑死刑、無期徒刑或十年以上之罪而發生死亡結果者，不受追訴權時效限制（§80 I①但書）。偵查、起訴或審判開始時停止進行（§83）。'],
['cr_28','cr_f','殺人罪章','§271–§276','普通殺人（§271）、殺直系血親尊親屬（§272加重二分之一）、義憤殺人（§273當場激於義憤）、加工自殺（§275）、過失致死（§276）。'],
['cr_29','cr_f','傷害罪章','§277–§287','普通傷害（§277，告訴乃論）、重傷（§278，重傷定義見§10 IV）、傷害致死或致重傷之加重結果犯（§277 II，須對加重結果能預見，§17）。'],
['cr_30','cr_f','妨害自由與名譽','§302–§310','私行拘禁（§302）、強制罪（§304）、恐嚇危害安全（§305）、侵入住居（§306）。公然侮辱（§309，113年憲判字第3號限縮）、誹謗（§310，真實抗辯與112年憲判字第8號）。'],
['cr_31','cr_f','竊盜與強盜','§320–§334','竊盜（§320）與加重竊盜（§321）；搶奪（§325）；強盜（§328）；準強盜：竊盜或搶奪因防護贓物、脫免逮捕或湮滅罪證而當場施強暴脅迫（§329）。'],
['cr_32','cr_f','侵占、詐欺與背信','§335–§343','侵占自己持有他人之物（§335、業務侵占§336）；詐欺（§339）與三人以上共同、網路散布等加重詐欺（§339-4）；背信（§342）；重利（§344）；恐嚇取財（§346）。'],
['cr_33','cr_f','偽造文書','§210–§220','偽造變造私文書（§210）、公文書（§211）；使公務員登載不實（§214）；行使偽造文書（§216）。須足以生損害於公眾或他人。'],
['cr_34','cr_f','公共危險','§173–§194','放火燒燬現供人使用之住宅（§173）；不能安全駕駛（§185-3，酒駕累犯加重）；肇事逃逸（§185-4，釋字777號後修正）。'],
['cr_35','cr_f','國家法益：公務與司法','§121–§172','公務員收賄（§121不違背職務、§122違背職務）；妨害公務（§135）；藏匿人犯（§164）、湮滅證據（§165，本人不罰）；偽證（§168）、誣告（§169）。']
],
links:[['cr_10','cr_8','誤想防衛'],['cr_4','cr_5','界線：間接故意vs有認識過失'],['cr_9','cr_13','都在罪責層次'],['cr_14','cr_16','未遂三型'],['cr_15','cr_16','未遂三型'],['cr_17','cr_18','正犯與共犯'],['cr_18','cr_19','從屬性'],['cr_20','cr_17','身分與共同正犯'],['cr_21','cr_22','一行為vs數行為'],['cr_23','cr_24','短期自由刑替代'],['cr_25','cr_24','累犯與緩刑要件'],['cr_31','cr_32','財產犯罪區辨'],['cr_32','cr_33','詐欺常與偽造文書競合'],['cr_28','cr_29','加重結果犯'],['cr_6','cr_28','不作為殺人'],['cr_2','cr_26','沒收適用裁判時法'],['cr_1','cr_2','溯及既往禁止'],['cr_11','cr_10','阻卻違法比較'],['cr_7','cr_29','加重結果與因果']],

SUBJ.constitution={name:'憲法',color:'#ffd166',paper:'一試 綜合法學(一)・40分',
core:{t:'基本權審查三步驟',a:'保護領域→限制→阻卻違憲',k:'先確認涉及哪一個基本權、是否落入保護範圍；再確認國家行為構成限制；最後審查限制是否合憲：法律保留（含授權明確）、明確性、比例原則（目的正當、手段適合、必要、衡平）。',m:'範圍・限制・正當化'},
groups:{cn_a:{n:'憲法原則',a:'總綱、增修條文',k:'民主國、法治國、權力分立、修憲。'},cn_b:{n:'基本權總論',a:'§22、§23',k:'主體、功能、審查基準。'},cn_c:{n:'自由權',a:'§8–§14',k:'人身、表現、宗教、隱私等自由。'},cn_d:{n:'平等與社會權',a:'§7、§15–§21',k:'平等權、工作權、財產權、訴訟權、參政權。'},cn_e:{n:'中央政府體制',a:'增修§2–§7',k:'總統、行政院、立法院、考監兩院。'},cn_f:{n:'司法與憲法訴訟',a:'§77–§82、憲法訴訟法',k:'司法院、憲法法庭、地方自治。'}},
nodes:[
['cn_1','cn_a','法治國原則','釋字多號','法律優位、法律保留、明確性、比例原則、信賴保護、正當法律程序，都從法治國原則導出。'],
['cn_2','cn_a','權力分立','釋字585、613','權力分立與制衡；核心領域不得侵犯（如獨立機關人事權，釋字613）。'],
['cn_3','cn_a','修憲程序與界限','增修§12、釋字499','立委四分之一提議、四分之三出席、出席四分之三決議提出修正案，公告半年後經公民複決，有效同意票過選舉人總額半數通過。釋字499號：修憲有界限。'],
['cn_4','cn_b','比例原則','§23','限制基本權須為防止妨礙他人自由、避免緊急危難、維持社會秩序或增進公共利益所必要。目的正當、手段適合、必要（最小侵害）、衡平（狹義比例）。','適合・必要・衡平'],
['cn_5','cn_b','法律保留與授權明確','釋字443','層級化法律保留：剝奪生命、限制人身自由須法律；其他事項可依法律授權以命令規定，授權須具體明確；細節性技術性事項得以行政規則。'],
['cn_6','cn_b','審查基準','實務','寬鬆（合理關聯）、中度（實質關聯）、嚴格（必要且最小侵害）。大法官依基本權類型、限制強度、分類標準決定。'],
['cn_7','cn_b','基本權功能','學說','防禦權、給付請求權、制度性保障（如婚姻、大學自治）、國家保護義務、程序保障；對私人間的第三人效力採間接效力。'],
['cn_8','cn_c','人身自由','§8','非由法院依法定程序不得審問處罰；逮捕拘禁須24小時內移送法院；提審制度。釋字384號：實質正當法律程序。'],
['cn_9','cn_c','言論自由','§11','高價值言論嚴格審查；商業言論（釋字414、577）中度審查；誹謗言論依112年憲判字第8號調和名譽權。事前審查原則禁止。'],
['cn_10','cn_c','集會結社自由','§14、釋字445、718','集會遊行採許可制部分違憲；緊急性、偶發性集會不得要求事前許可（釋字718）。'],
['cn_11','cn_c','宗教自由','§13、釋字490','內在信仰自由絕對保障；宗教行為與結社自由可受限制。宗教中立原則。'],
['cn_12','cn_c','秘密通訊與隱私權','§12、§22、釋字603、631','通訊監察須由法官核發（釋字631）。資訊隱私權：強制按捺指紋違憲（釋字603）；個資自主控制。'],
['cn_13','cn_c','婚姻與家庭','§22、釋字748','婚姻自由受§22保障；未使同性二人得成立永久結合關係違反平等權與婚姻自由（釋字748），後制定施行法。'],
['cn_14','cn_d','平等權','§7','實質平等，合理差別待遇許可。審查差別待遇之目的與分類手段的關聯性；可疑分類（性別、種族）提高審查密度。'],
['cn_15','cn_d','職業自由','§15、釋字584、649','職業自由三階段：執行職業方法（寬鬆）、主觀條件（中度）、客觀條件（嚴格）。釋字649：視障按摩保留違憲。','方法・主觀・客觀'],
['cn_16','cn_d','財產權與特別犧牲','§15、釋字400','財產權保障所有人自由使用收益處分。因公益而受特別犧牲者應予補償（釋字400既成道路）。'],
['cn_17','cn_d','訴訟權','§16、釋字653、784','有權利即有救濟；受羈押被告（釋字653）、各級學校學生（釋字784）受侵害時可提起行政訴訟，不再受特別權力關係限制。'],
['cn_18','cn_d','參政權與公投','§17、§18','選舉、罷免、創制、複決四權，公投法落實創制複決。應考試服公職權（§18）。'],
['cn_19','cn_d','租稅法律主義','§19','稅捐主體、客體、稅基、稅率等租稅構成要件須以法律明定；解釋函令不得增加法律所無之納稅義務。'],
['cn_20','cn_e','總統','增修§2','人民直選；任命行政院長無須立法院同意；得發布緊急命令（須10日內提交立法院追認）；立法院通過不信任案後10日內得解散立法院。'],
['cn_21','cn_e','行政院與覆議','增修§3','行政院對立法院負責；覆議案於送達15日內作成決議，全體立委二分之一以上決議維持原案，行政院長應即接受。立委三分之一以上連署得提不信任案。'],
['cn_22','cn_e','立法院','增修§4','立法委員113席，任期4年。國會調查權（釋字585、729；113年憲判字第9號）須有法律依據並受權力分立限制。'],
['cn_23','cn_e','考試院與監察院','增修§6、§7','考試院掌考試、公務人員銓敘等；監察委員29人，由總統提名經立法院同意，行使彈劾、糾舉、審計權。'],
['cn_24','cn_f','司法院與大法官','增修§5','大法官15人，任期8年，由總統提名經立法院同意；組成憲法法庭審理憲法訴訟案件。'],
['cn_25','cn_f','憲法訴訟法','2022年施行','法規範憲法審查、裁判憲法審查（不利確定終局裁判送達後6個月內）、機關爭議、總統彈劾、政黨違憲解散、地方自治保障、統一解釋。'],
['cn_26','cn_f','地方自治','增修§9、地方制度法','地方自治團體有自主組織、自治立法、財政權；中央與地方權限依均權原則；自治監督。']
],

nodes:[
['ad_1','ad_a','依法行政','§4','法律優位（行政不得牴觸法律）與法律保留（干預人民權利須有法律依據）。'],
['ad_2','ad_a','比例原則','§7','行政行為採取之方法應有助於目的達成；有多種同樣能達成目的之方法時，選擇對人民權益損害最少者；造成之損害不得與欲達成目的之利益顯失均衡。'],
['ad_3','ad_a','平等原則與行政自我拘束','§6','非有正當理由不得為差別待遇；行政先例形成自我拘束，但不法之平等不得主張。'],
['ad_4','ad_a','信賴保護','§8、§119、§120','信賴基礎、信賴表現、信賴值得保護三要件。以詐欺脅迫、提供不正確資料或明知違法而取得者，信賴不值得保護（§119）。'],
['ad_5','ad_a','裁量與不確定法律概念','§10','裁量不得逾越法定範圍、應符合授權目的（裁量逾越、濫用、怠惰）。不確定法律概念原則全面審查，涉高度專業或屬人性者承認判斷餘地。'],
['ad_6','ad_b','委任、委託與委辦','§15、§16','委任：上下隸屬機關間；委託：不相隸屬機關間；委託私人行使公權力須有法律依據（§16），受託人為行政機關（訴訟上被告）。'],
['ad_7','ad_b','公法人與行政法人','地方制度法、行政法人法','地方自治團體、農田水利會（已改制）、行政法人具公法人地位，可為權利義務主體。'],
['ad_8','ad_c','行政處分','§92','行政機關就公法上具體事件所為之決定或其他公權力措施，對外直接發生法律效果之單方行政行為；對象可得確定之一般處分亦屬之。','機關・公權力・具體・單方・對外法效'],
['ad_9','ad_c','行政處分附款','§93、§94','期限、條件、負擔、保留廢止權、保留負擔之事後附加或變更。附款不得違背處分目的，並應與處分目的具有正當合理之關聯（不當聯結禁止）。'],
['ad_10','ad_c','行政處分無效','§111','七款無效事由（不能由書面辨認處分機關、應以證書方式作成而未給予證書、內容對任何人均屬不能實現、違反犯罪、違背公序良俗、未經授權違背專屬管轄、其他重大明顯瑕疵）。'],
['ad_11','ad_c','撤銷與廢止','§117–§127','違法處分之撤銷（§117），授益處分受信賴保護限制，撤銷時對值得保護之信賴給予補償（§120）；合法處分之廢止（§122、§123）；撤銷權除斥期間2年（§121）。'],
['ad_12','ad_c','程序重新進行','§128','處分於法定救濟期間經過後，因事實或法律狀態變更、發現新證據等，相對人得於3個月內申請撤銷、廢止或變更。'],
['ad_13','ad_c','行政契約','§135–§149','公法上法律關係得以契約設定變更消滅；雙務契約之對待給付應與契約目的有正當合理關聯（§137）；締約應以書面為之（§139）。'],
['ad_14','ad_c','法規命令與行政規則','§150、§159','法規命令須有法律授權且授權明確，對外發生效力；行政規則為上級對下級之內部規範（作業性、解釋性、裁量基準）。'],
['ad_15','ad_c','行政計畫與行政指導','§163–§167','行政計畫（涉土地利用之確定計畫程序）；行政指導不具法律上強制力，不得因相對人不從而為不利處置（§166）。'],
['ad_16','ad_d','陳述意見與聽證','§102–§109','作成限制或剝奪自由權利之處分前，應給予陳述意見機會（有例外）；法規明定者應舉行聽證，經聽證之處分免除訴願程序（§109）。'],
['ad_17','ad_d','行政罰法','§4–§27','處罰法定（§4）；故意過失責任（§7）；一行為不二罰，同時觸犯刑事法律者依刑事法律處罰（§26）；裁處權時效3年（§27）。'],
['ad_18','ad_d','行政執行','行政執行法','公法上金錢給付義務由行政執行署執行；行為或不行為義務以間接強制（代履行、怠金）或直接強制為之；即時強制（對人管束、對物扣留等）。'],
['ad_19','ad_e','訴願','訴願法','對違法或不當之行政處分，於處分書達到或公告期滿之次日起30日內提起（§14）；訴願決定應於收受訴願書之次日起3個月內作成；不利益變更禁止（§81）。'],
['ad_20','ad_e','撤銷訴訟','行政訴訟法§4','對違法行政處分，經訴願程序後提起，請求撤銷原處分或決定。須處分尚存在、原告有權利或法律上利益受損。'],
['ad_21','ad_e','課予義務訴訟','行政訴訟法§5','怠為處分之訴與拒絕申請之訴：人民依法申請遭拒或逾期不作為，經訴願後請求判命機關作成特定處分。'],
['ad_22','ad_e','確認與一般給付訴訟','行政訴訟法§6、§8','確認處分無效、確認公法上法律關係成立不成立、確認已執行完畢或消滅之處分違法；一般給付訴訟用於財產上給付或非處分之行為（如公法契約給付）。'],
['ad_23','ad_e','暫時權利保護','行政訴訟法§116、§298','原處分之執行原則不停止，符合要件時法院得裁定停止執行；假處分、假扣押用於其他情形。'],
['ad_24','ad_e','行政訴訟新制','2023年施行','地方行政訴訟庭三級二審；都市計畫審查程序（行政訴訟法§237-18起）；律師強制代理於上訴審。'],
['ad_25','ad_f','公務員國家賠償','國賠法§2','公務員於執行職務行使公權力時，因故意或過失不法侵害人民自由或權利；怠於執行職務致人民權益受損亦同（§2 II後段）。有故意或重大過失時國家得求償。'],
['ad_26','ad_f','公共設施國家賠償','國賠法§3','公有公共設施因設置或管理有欠缺，致人民生命身體財產受損，採無過失責任；委託民間管理者亦適用。'],
['ad_27','ad_f','國賠程序與時效','國賠法§8、§10、§13','協議先行（§10）；請求權自知有損害時起2年、損害發生時起5年（§8）；審判追訴職務之公務員，須就參與審判追訴案件犯職務上之罪經判決有罪確定（§13）。'],
['ad_28','ad_f','損失補償','釋字400、440','合法公權力措施造成人民特別犧牲，應予補償；徵收補償應相當。']
],

SUBJ.civpro={name:'民事訴訟法',color:'#4cc9f0',paper:'一試 綜合法學(二)・60分',
core:{t:'民訴解題主軸',a:'訴訟要件→本案審理→判決效力',k:'先檢查審判權、管轄、當事人能力與適格、訴訟能力、權利保護必要等訴訟要件；再看處分權主義與辯論主義下的本案審理與舉證；最後判斷判決效力（既判力、爭點效）與上訴救濟。',m:'要件→審理→效力→救濟'},
groups:{vp_a:{n:'基本原則',a:'§196、§199、§388',k:'處分權主義、辯論主義、闡明、集中審理。'},vp_b:{n:'法院與當事人',a:'§1–§76',k:'管轄、當事人、共同訴訟、參加、代理。'},vp_c:{n:'訴與訴之變動',a:'§244–§264',k:'起訴、訴之變更追加、反訴、撤回、重複起訴。'},vp_d:{n:'證據',a:'§277–§376',k:'舉證責任、自認、證據方法、證明妨礙。'},vp_e:{n:'判決與效力',a:'§380–§401',k:'既判力、和解、調解、一造辯論。'},vp_f:{n:'上訴與特別程序',a:'§437–§538',k:'上訴、再審、簡易小額、保全程序。'}},
nodes:[
['vp_1','vp_a','處分權主義','§388','程序之開始、審判對象範圍、程序之終結由當事人決定；法院不得就當事人未聲明之事項為判決。'],
['vp_2','vp_a','辯論主義','實務與學說','裁判基礎事實須由當事人主張；當事人不爭執之事實法院應採為裁判基礎（自認拘束）；證據原則由當事人聲明。'],
['vp_3','vp_a','闡明義務','§199、§199-1','審判長應注意令當事人就訴訟關係之事實及法律為適當完全之辯論；原告主張之事實可主張數項法律關係而未主張者，應曉諭其敘明（§199-1）。防止突襲性裁判。'],
['vp_4','vp_a','集中審理與失權','§196、§268-1、§447','攻擊防禦方法應依訴訟進行程度於適當時期提出，逾時提出致延滯訴訟者得駁回（§196）；爭點整理；第二審新攻擊防禦方法原則禁止（§447）。'],
['vp_5','vp_b','管轄','§1–§31','以原告就被告（§1）；特別審判籍如侵權行為地（§15）；不動產專屬管轄（§10）；合意管轄（§24）、應訴管轄（§25）；無管轄權者裁定移送（§28）。'],
['vp_6','vp_b','當事人能力與訴訟能力','§40、§45','有權利能力者有當事人能力；非法人團體設有代表人或管理人者亦有當事人能力（§40 III）。能獨立以法律行為負義務者有訴訟能力。'],
['vp_7','vp_b','共同訴訟','§53–§56','普通共同訴訟各人行為效力獨立（§55）；必要共同訴訟一人行為有利者效力及於全體，不利者不生效力（§56）。'],
['vp_8','vp_b','訴訟參加與告知','§58–§67','就兩造訴訟有法律上利害關係之第三人得輔助一造參加；參加人對所輔助當事人不得主張本訴訟裁判不當（參加效，§63）；訴訟告知亦生參加效。'],
['vp_9','vp_b','訴訟代理','§68–§76','委任代理人應於每一審級為之；捨棄、認諾、撤回、和解、提起反訴、上訴或再審、選任代理人須特別委任（§70 I但書）；代理權不因本人死亡而消滅（§73）。'],
['vp_10','vp_b','當事人恆定與承當','§254','訴訟繫屬中為訴訟標的之法律關係移轉於第三人，於訴訟無影響；第三人經兩造同意得承當訴訟；就物權訴訟得聲請訴訟繫屬事實登記。'],
['vp_11','vp_c','訴訟標的','實務：舊實體法說','實務以原告主張的實體法上權利為訴訟標的；請求權競合時為不同訴訟標的，可預備或選擇合併。'],
['vp_12','vp_c','訴之變更追加','§255、§446','訴狀送達後原則不得變更追加，例外如被告同意、請求之基礎事實同一、擴張或減縮應受判決事項之聲明等；第二審另受§446限制。'],
['vp_13','vp_c','反訴','§259、§260','被告於言詞辯論終結前得在本訴繫屬之法院提起反訴；須與本訴標的或防禦方法相牽連，且非專屬他法院管轄、非不同種類訴訟程序。'],
['vp_14','vp_c','訴之撤回','§262、§263','判決確定前得撤回，被告已為本案言詞辯論者應得其同意；於本案經終局判決後撤回者，不得復提起同一之訴（§263 II）。'],
['vp_15','vp_c','重複起訴禁止','§253','當事人不得就已起訴之事件，於訴訟繫屬中更行起訴。判斷：當事人、訴訟標的、訴之聲明相同或正相反或可代用。'],
['vp_16','vp_d','舉證責任分配','§277','主張有利於己之事實者負舉證責任；依其情形顯失公平者不在此限（舉證責任轉換）。實務採規範說。'],
['vp_17','vp_d','自認與擬制自認','§279、§280','當事人主張之事實經他造於準備書狀或言詞辯論時自認者，無庸舉證；撤銷自認須證明與事實不符或經他造同意。對他造主張之事實不爭執者視同自認。'],
['vp_18','vp_d','證據方法','§298–§367-3','人證、鑑定、書證、勘驗、當事人訊問（§367-1）；文書提出義務（§344）與不從命之效果（§345）；證明妨礙（§282-1）。'],
['vp_19','vp_d','證據保全','§368–§376-2','證據有滅失或礙難使用之虞，或經他造同意，或確定事、物現狀有法律上利益時，得聲請保全；可在程序中成立協議。'],
['vp_20','vp_e','既判力','§400、§401','確定判決之既判力及於主文判斷之訴訟標的；主觀範圍及於當事人、言詞辯論終結後之繼受人（§401）；抵銷抗辯之判斷以主張抵銷之額為限有既判力（§400 II）。'],
['vp_21','vp_e','爭點效','實務','前訴重要爭點經兩造充分攻防、法院實質審理判斷，後訴同一爭點原則不得為相反主張，但顯然違背法令或有新訴訟資料足以推翻者除外。'],
['vp_22','vp_e','訴訟上和解與調解','§377、§380、§403、§416','訴訟上和解與確定判決有同一效力（§380）；和解有無效或得撤銷原因者得請求繼續審判。特定事件起訴前應經法院調解（§403）；調解成立與和解同效（§416）。'],
['vp_23','vp_e','一造辯論判決與捨棄認諾','§384、§385','言詞辯論期日當事人一造不到場，得依到場當事人聲請由其一造辯論而為判決（有正當理由不到場等除外）；捨棄認諾應本於其捨棄或認諾為判決。'],
['vp_24','vp_f','第二審上訴','§437–§463','上訴期間20日；第二審採續審制並限制新攻擊防禦方法；附帶上訴（§460）；第一審程序重大瑕疵得廢棄發回（§451）。'],
['vp_25','vp_f','第三審上訴','§464–§481','非以判決違背法令為理由不得為之（§467）；上訴利益逾新臺幣150萬元（§466）；律師強制代理（§466-1）；許可上訴制（§469-1）。'],
['vp_26','vp_f','再審','§496–§507','確定判決有§496列舉事由（適用法規顯有錯誤、發現未經斟酌之證物等）得提再審之訴，於判決確定後30日不變期間內提起（§500）；已於上訴主張或知其事由而不為主張者不得再審。'],
['vp_27','vp_f','簡易與小額程序','§427、§436-8','財產權訴訟標的50萬元以下適用簡易程序，另有列舉事件；10萬元以下適用小額程序，第二審限於違背法令。'],
['vp_28','vp_f','保全程序','§522–§538','假扣押保全金錢請求（§522）；假處分保全非金錢請求（§532）；定暫時狀態處分（§538）。請求及原因均須釋明，釋明不足得命供擔保。'],
['vp_29','vp_f','督促程序','§508–§521','債權人之請求以給付金錢或其他代替物或有價證券之一定數量為標的者，得聲請發支付命令；債務人20日內未異議者，得為執行名義。']
],

nodes:[
['pc_1','pc_a','無罪推定與證據裁判','§154','被告未經審判證明有罪確定前推定無罪；犯罪事實應依證據認定，無證據不得認定。檢察官負實質舉證責任（§161 I）。'],
['pc_2','pc_a','告知義務與緘默權','§95','訊問前應告知：犯罪嫌疑及所犯所有罪名、得保持緘默、得選任辯護人、得請求調查有利證據。違反第②③款所取得之自白原則無證據能力（§158-2）。'],
['pc_3','pc_a','辯護制度','§27–§34','強制辯護：最輕本刑三年以上、高等法院管轄第一審、心智障礙無法完全陳述、原住民等（§31）。辯護人接見通信權（§34）。'],
['pc_4','pc_a','管轄與迴避','§4–§26','事物管轄與土地管轄；牽連管轄；法官曾參與前審裁判等應自行迴避（§17）。'],
['pc_5','pc_b','拘提與逮捕','§75–§93','傳喚不到得拘提；通緝犯（§87）、現行犯與準現行犯（§88）得逕行逮捕；檢警於情況急迫時得緊急拘捕（§88-1）。拘捕後24小時內移送法院（§93）。'],
['pc_6','pc_b','羈押','§101–§121','經法官訊問，犯罪嫌疑重大，且有逃亡、串證之虞或犯重罪，非予羈押顯難進行追訴審判執行者（§101）；預防性羈押（§101-1）。偵查中羈押2月、審判中3月（§108）。'],
['pc_7','pc_b','羈押替代處分','§110–§116-2','具保、責付、限制住居、限制出境出海（§93-2起）、科技設備監控等，並得命遵守特定事項（§116-2）。'],
['pc_8','pc_b','搜索','§122–§153','原則由法官核發搜索票（§128）；無令狀搜索：附帶搜索（§130）、逕行搜索（§131）、同意搜索（§131-1，須自願性同意並記錄）。'],
['pc_9','pc_b','扣押與通訊監察','§133、通訊保障及監察法','可為證據或得沒收之物得扣押；非附隨於搜索之扣押原則應經法官裁定（§133-1）。通訊監察須法官核發通訊監察書。'],
['pc_10','pc_c','偵查原則','§228、§245','檢察官因告訴、告發、自首或其他情事知有犯罪嫌疑者應即開始偵查；偵查不公開（§245）。司法警察（官）協助偵查。'],
['pc_11','pc_c','告訴乃論','§237–§239','告訴應自知悉犯人之時起6個月內為之（§237）；得於第一審辯論終結前撤回，撤回者不得再告訴（§238）；告訴不可分（§239）。'],
['pc_12','pc_c','不起訴與緩起訴','§252–§253-3','絕對不起訴（§252）、職權不起訴（§253）；緩起訴：死刑、無期徒刑、最輕本刑三年以上以外之罪，得定1至3年緩起訴期間並命被告遵守事項（§253-1、§253-2）。'],
['pc_13','pc_c','再議與聲請准許提起自訴','§256、§258-1','告訴人不服不起訴或緩起訴處分得聲請再議；再議駁回後得委任律師向法院聲請准許提起自訴（2023年修正取代交付審判）。'],
['pc_14','pc_c','自訴','§319–§343','犯罪之被害人得提起自訴，應委任律師行之（§319 II）；不得對直系血親尊親屬或配偶提起自訴（§321）；同一案件經檢察官開始偵查者原則不得再自訴（§323）。'],
['pc_15','pc_d','證據能力與證明力','§155','證據須有證據能力並經合法調查才能作為判斷依據；證明力由法院依經驗法則與論理法則自由判斷（§155 I）。'],
['pc_16','pc_d','自白','§156','非出於強暴、脅迫、利誘、詐欺、疲勞訊問、違法羈押等不正方法，且與事實相符者，得為證據；不得作為有罪判決之唯一證據（補強法則）。'],
['pc_17','pc_d','傳聞法則與例外','§159–§159-5','被告以外之人審判外陳述原則無證據能力。例外：法官面前陳述、檢察官面前陳述（顯不可信者除外）、檢警調詢問陳述具較可信特別情況且必要、特信性文書、當事人同意（§159-5）。'],
['pc_18','pc_d','違法證據排除','§158-2、§158-4','違背夜間詢問、告知義務所取得之自白原則排除（§158-2）；其他實施刑事訴訟程序之公務員違背法定程序取得之證據，其有無證據能力依人權保障與公共利益權衡（§158-4）。毒樹果實理論見解不一。'],
['pc_19','pc_d','交互詰問與證人','§166–§196-1','主詰問、反詰問、覆主詰問、覆反詰問；證人具結義務；親屬拒絕證言（§180）、恐致自己受追訴之拒絕證言（§181）。被告之對質詰問權受憲法保障（釋字582）。'],
['pc_20','pc_e','起訴審查與審判範圍','§161 II、§267、§268','法院於第一次審判期日前認檢察官指出之證明方法顯不足認定被告有成立犯罪可能時，得命補正或駁回起訴。一部起訴效力及於全部（§267）；不告不理（§268）。'],
['pc_21','pc_e','變更起訴法條','§300','在不妨害事實同一之範圍內，法院得就起訴之犯罪事實變更檢察官所引應適用之法條，但應告知被告罪名變更並給予辯論機會。'],
['pc_22','pc_e','免訴與不受理','§302、§303','免訴：曾經判決確定、時效已完成、曾經大赦、犯罪後法律已廢止其刑罰（一事不再理）。不受理：起訴程序違背規定、告訴乃論未告訴或已撤回、被告死亡等。'],
['pc_23','pc_e','簡式審判與簡易判決','§273-1、§449','非重罪且被告就被訴事實為有罪陳述者得行簡式審判；簡易判決處刑：被告自白或卷證足認犯罪，科刑以宣告緩刑、得易科罰金或易服社會勞動之有期徒刑及拘役或罰金為限。'],
['pc_24','pc_e','國民法官審判','國民法官法','2023年施行：故意犯罪致被害人死亡之罪等由國民法官與職業法官共同審判；起訴狀一本主義、卷證不併送。'],
['pc_25','pc_f','上訴通則','§344–§373','上訴期間20日（§349）；由被告上訴或為被告利益上訴者，第二審不得諭知較重於原審判決之刑（不利益變更禁止，§370），但因原審判決適用法條不當而撤銷者不在此限。'],
['pc_26','pc_f','第三審上訴限制','§376、§377','§376所列輕微案件原則不得上訴第三審（第二審首次改判有罪者例外得上訴）；上訴第三審非以判決違背法令為理由不得為之（§377）。'],
['pc_27','pc_f','再審','§420–§440','為受判決人利益：原判決所憑證物偽造、發現新事實新證據足認應受無罪等判決（§420）；為受判決人不利益（§422）有嚴格限制。'],
['pc_28','pc_f','非常上訴與協商','§441、§455-2','判決確定後發見案件之審判係違背法令者，最高檢察署檢察總長得提起非常上訴。協商程序：非重罪經檢察官與被告合意，法院依協商判決，原則不得上訴。']
],

core:{t:'公司法解題主軸',a:'誰有權決定→程序是否合法→責任歸屬',k:'先判斷事項屬股東會、董事會或董事長權限；再檢查召集程序、決議方法與利益迴避；最後處理瑕疵效果（撤銷、無效、不成立）與負責人責任（忠實義務、連帶賠償、歸入權）。',m:'權限・程序・責任'},
groups:{co_a:{n:'總則',a:'§1–§39',k:'公司種類、負責人、轉投資與資金貸與限制。'},co_b:{n:'股份與資本',a:'§156–§169、§266–§268',k:'股份、特別股、庫藏股、發行新股。'},co_c:{n:'股東會',a:'§170–§193',k:'召集、決議、瑕疵、少數股東權。'},co_d:{n:'董事與董事會',a:'§192–§215',k:'選任解任、董事會、利益衝突、代位訴訟。'},co_e:{n:'監察人與會計',a:'§216–§245',k:'監察權、盈餘分派、公積。'},co_f:{n:'組織變動與特殊公司',a:'§315–§369-12',k:'合併分割、解散清算、閉鎖性公司、關係企業。'}},
nodes:[
['co_1','co_a','公司種類','§2','無限公司、有限公司、兩合公司、股份有限公司。公司非在中央主管機關登記後不得成立（§6）。'],
['co_2','co_a','公司負責人與實質董事','§8','當然負責人（股份有限公司為董事）與職務負責人；非董事而實質執行董事業務或實質控制人事財務者，與董事同負民事刑事及行政罰責任（§8 III）。'],
['co_3','co_a','忠實義務與歸入權','§23','負責人應忠實執行業務並盡善良管理人注意義務，違反致公司受損應負賠償責任；對他人連帶負責（§23 II）；為自己或他人所為行為，股東會得決議將所得視為公司所得（歸入權，§23 III）。'],
['co_4','co_a','轉投資、貸與與保證限制','§13、§15、§16','公司不得為他公司無限責任股東；資金貸與股東或他人以業務往來或短期融通為限；公司除依法律或章程得為保證者外，不得為任何保證人，違反者負責人自負保證責任。'],
['co_5','co_a','揭穿公司面紗','§154 II','股東濫用公司法人地位，致公司負擔特定債務且清償顯有困難，其情節重大而有必要者，該股東應負清償責任。'],
['co_6','co_b','股份轉讓自由','§163','公司股份之轉讓，除本法另有規定外，不得以章程禁止或限制之。閉鎖性公司得於章程限制（§356-5）。'],
['co_7','co_b','特別股','§157','得發行優先或劣後分派股息紅利、剩餘財產、複數表決權或無表決權、當選一定名額董事等特別股（非公開發行公司範圍較廣）。'],
['co_8','co_b','庫藏股','§167、§167-1','公司原則不得自將股份收回、收買或收為質物；例外如員工庫藏股（§167-1）、股東行使收買請求權等。'],
['co_9','co_b','發行新股','§266–§268','授權資本制下由董事會決議發行；原股東有優先認購權，員工承購保留10%至15%（§267）。'],
['co_10','co_c','股東會召集','§170–§173-1','常會每年至少一次，由董事會召集；繼續一年以上持有3%以上股份之股東得請求或經許可自行召集（§173）；繼續三個月以上持有過半數股份者得自行召集（§173-1）。'],
['co_11','co_c','股東會決議方法','§174、§185','普通決議：代表已發行股份總數過半數之出席、出席股東表決權過半數同意。特別決議：三分之二以上出席、出席過半數同意（如營業讓與§185、變更章程§277）。'],
['co_12','co_c','決議瑕疵','§189、§191','召集程序或決議方法違反法令或章程者，股東得自決議之日起30日內訴請撤銷（§189）；決議內容違反法令或章程者無效（§191）；決議不成立為實務類型。'],
['co_13','co_c','股東提案權與利害迴避','§172-1、§178','持有1%以上股份之股東得以書面向公司提出股東常會議案；股東對會議事項有自身利害關係致有害公司利益之虞時，不得加入表決（§178）。'],
['co_14','co_d','董事選任與解任','§192、§198、§199','董事由股東會選任，採累積投票制（§198）；股東會得隨時以特別決議解任董事（§199），無正當理由於任期屆滿前解任者董事得請求賠償。'],
['co_15','co_d','董事會','§202–§206','業務之執行由董事會決議行之，法令或章程規定屬股東會者除外（§202）；董事對會議事項有自身利害關係應說明，並準用利害迴避（§206）。'],
['co_16','co_d','董事競業禁止','§209','董事為自己或他人為屬於公司營業範圍內之行為，應對股東會說明並取得許可；違反者股東會得決議將所得視為公司所得。'],
['co_17','co_d','自己交易','§223','董事為自己或他人與公司為買賣、借貸或其他法律行為時，由監察人為公司之代表。'],
['co_18','co_d','股東代位訴訟','§214','繼續六個月以上持有已發行股份總數1%以上之股東，得以書面請求監察人為公司對董事提起訴訟；監察人30日內不提起者，股東得自行提起。'],
['co_19','co_e','監察人','§216–§227','監察人得隨時調查公司業務及財務狀況；公司與董事間訴訟由監察人代表公司（§213）。公開發行公司得以審計委員會取代監察人。'],
['co_20','co_e','盈餘分派與公積','§232、§237','公司非彌補虧損及依規定提出法定盈餘公積後不得分派股息紅利；法定盈餘公積提列10%，達資本總額時不在此限。'],
['co_21','co_f','合併與分割','§316–§319-1','合併、分割應經股東會特別決議；反對股東有股份收買請求權（§317）；公司債權人保護程序（§73、§74準用）。'],
['co_22','co_f','解散與清算','§315、§322','解散事由（章程所定、目的不能達成、股東會決議、合併分割、破產、命令解散等）；解散後應行清算，公司於清算範圍內視為存續（§25）。'],
['co_23','co_f','閉鎖性股份有限公司','§356-1–§356-14','股東人數不超過50人，章程載有股份轉讓限制；發起人得以技術或勞務抵充出資（勞務有比例限制）；得發行複數表決權特別股。'],
['co_24','co_f','關係企業','§369-1–§369-12','控制公司使從屬公司為不合營業常規或不利益之經營而未於營業年度終了時適當補償，致從屬公司受損者，應負賠償責任（§369-4）。']
],

core:{t:'保險法解題主軸',a:'契約效力→保險事故→理賠與代位',k:'先確認保險利益、告知義務與特約條款是否影響契約效力；再判斷保險事故是否在承保範圍、有無除外責任；最後處理理賠對象（受益人、責任保險第三人）與代位求償。',m:'利益・告知・事故・代位'},
groups:{in_a:{n:'通則',a:'§1–§53',k:'保險利益、保險費、複保險、代位。'},in_b:{n:'保險契約',a:'§54–§69',k:'告知義務、特約條款、時效、解釋原則。'},in_c:{n:'財產保險',a:'§70–§101',k:'火災、責任、保證保險。'},in_d:{n:'人身保險',a:'§101–§135-4',k:'人壽、健康、傷害、年金保險。'}},
nodes:[
['in_1','in_a','保險利益','§14–§20','財產保險：要保人對財產上之現有利益或期待利益、運送人保管人責任、債權人對債務人財產（§14、§15、§20）。人身保險：本人、家屬、生活費教育費所仰給之人、債務人（§16）。無保險利益者契約失其效力（§17）。'],
['in_2','in_a','複保險','§35–§38','要保人對同一保險利益、同一保險事故與數保險人分別訂約；應通知各保險人；惡意不通知或意圖不當得利者契約無效（§37）。實務認人身保險不適用複保險。'],
['in_3','in_a','保險代位','§53','被保險人因保險人應負責之損失，對第三人有損失賠償請求權者，保險人得於給付賠償金額後代位行使（限財產保險）；人壽保險人不得代位（§103）。'],
['in_4','in_a','保險人責任與除外','§29','保險人對於由不可預料或不可抗力之事故所致損害負賠償責任；要保人或被保險人之過失所致者亦負責，但出於故意者不負責任。'],
['in_5','in_b','告知義務','§64','訂約時要保人對保險人書面詢問應據實說明；故意隱匿、過失遺漏或不實說明足以變更或減少保險人對危險之估計者，保險人得解除契約；但要保人證明危險發生未基於該事實者不在此限。解除權自知悉後1個月、契約訂立後2年消滅。','據實說明・1個月・2年'],
['in_6','in_b','危險增加通知','§59','要保人對於危險增加應通知保險人；由要保人或被保險人行為所致者應先通知，保險人得提議另定保費或終止契約。'],
['in_7','in_b','特約條款','§66–§69','當事人於基本條款外承認履行特種義務之條款；違背特約條款時，他方得解除契約，其危險發生後亦同（§68）。'],
['in_8','in_b','契約解釋與消滅時效','§54、§65','保險契約之解釋應探求當事人真意，有疑義時以作有利於被保險人之解釋為原則（§54 II）。由保險契約所生之權利自得為請求之日起2年不行使而消滅（§65）。'],
['in_9','in_c','火災保險與超額保險','§70–§82、§76','火災保險依實際損失賠償；保險金額超過保險標的價值之契約，由當事人一方之詐欺而訂立者，他方得解除；無詐欺者僅於保險標的價值之限度內有效（§76）。'],
['in_10','in_c','責任保險','§90–§95','保險人於被保險人對第三人依法應負賠償責任而受賠償請求時負賠償責任；第三人得在保險金額範圍內直接向保險人請求（§94 II）。'],
['in_11','in_c','保證保險','§95-1–§95-3','保險人於被保險人因其受僱人之不誠實行為或其債務人之不履行債務所致損失負賠償責任。'],
['in_12','in_d','人壽保險與被保險人同意','§101–§124','由第三人訂立之死亡保險契約，未經被保險人書面同意並約定保險金額者，契約無效（§105）；以未滿15歲者為被保險人，除喪葬費用外，死亡給付於滿15歲時始生效（§107）。'],
['in_13','in_d','受益人','§110–§114','要保人得指定或變更受益人；受益人故意致被保險人於死或雖未致死者，喪失其受益權（§121 I）。'],
['in_14','in_d','健康、傷害與年金保險','§125–§135-4','健康保險：疾病、分娩及其所致殘廢或死亡；傷害保險：意外傷害及其所致殘廢或死亡；年金保險：生存期間或特定期間依約定分期給付。']
],

SUBJ.bills={name:'票據法',color:'#3a86ff',paper:'一試 綜合法學(二)・20分',
core:{t:'票據法解題主軸',a:'形式要件→票據行為→權利行使',k:'先判斷票據是否具備法定應記載事項（要式性）；再看各票據行為（發票、背書、承兌、保證）是否有效、有無偽造變造；最後判斷執票人權利（善意取得、抗辯切斷、追索權、時效）。',m:'要式・文義・無因・獨立'},
groups:{bn_a:{n:'票據通則',a:'§1–§23',k:'票據性質、偽造變造、抗辯、時效。'},bn_b:{n:'匯票',a:'§24–§119',k:'背書、承兌、保證、付款、追索。'},bn_c:{n:'本票',a:'§120–§124',k:'見票、本票裁定強制執行。'},bn_d:{n:'支票',a:'§125–§144',k:'提示期限、平行線、保付。'}},
nodes:[
['bn_1','bn_a','票據特性','§5、§11','要式性（欠缺法定應記載事項者無效，§11 I）、文義性（依票上所載文義負責，§5）、無因性、票據行為獨立性（§8、§15）。'],
['bn_2','bn_a','空白授權票據','§11 II','執票人善意取得已具備法定應記載事項之票據者，得依票據文義行使權利，票據債務人不得以原係欠缺應記載事項為由主張無效。'],
['bn_3','bn_a','票據偽造與變造','§15、§16','偽造不影響真正簽名之效力（§15）。變造：簽名在變造前者依原有文義負責，在變造後者依變造文義負責，不能辨別者推定在變造前（§16）。'],
['bn_4','bn_a','票據抗辯','§13、§14','票據債務人不得以自己與發票人或執票人前手間所存抗辯事由對抗執票人（抗辯切斷），但執票人取得出於惡意者不在此限（§13）。無對價或不相當對價取得者，不得享有優於前手之權利（§14 II）。'],
['bn_5','bn_a','善意取得','§14 I','以惡意或有重大過失取得票據者，不得享有票據上之權利；反面解釋，善意且無重大過失自無權利人受讓者，取得票據權利。'],
['bn_6','bn_a','票據喪失','§18、§19','票據喪失時得為止付通知，並應於5日內提出已為聲請公示催告之證明；得聲請公示催告與除權判決。'],
['bn_7','bn_a','時效與利益償還請求權','§22','對匯票承兌人及本票發票人3年；對支票發票人1年；追索權：匯票本票1年、支票4個月；背書人再追索：匯票本票6個月、支票2個月。票據權利因時效或手續欠缺而消滅時，得對發票人或承兌人於所受利益限度內請求償還（§22 IV）。','3年・1年・4個月・2個月'],
['bn_8','bn_b','背書','§30–§41','背書轉讓；發票人記載禁止轉讓者不得轉讓（§30 II）；背書連續證明權利（§37）；期後背書僅有通常債權轉讓之效力（§41）。'],
['bn_9','bn_b','承兌與參加','§42–§57','付款人承兌後負付款責任；參加承兌、參加付款。本票、支票無承兌制度。'],
['bn_10','bn_b','票據保證','§58–§64','保證人與被保證人負同一責任；被保證人之債務縱為無效，保證人仍負擔其義務，但因方式欠缺者不在此限（§61）。'],
['bn_11','bn_b','付款與追索權','§69–§105','執票人應於到期日或其後二日內為付款之提示；不獲付款時得對背書人、發票人及其他票據債務人行使追索權，票據債務人對執票人連帶負責（§96）。'],
['bn_12','bn_c','本票裁定強制執行','§123','執票人向本票發票人行使追索權時，得聲請法院裁定後強制執行；屬非訟事件，發票人對債權不存在有爭執應另提確認之訴。'],
['bn_13','bn_c','見票與發票人責任','§121、§122','本票發票人所負責任與匯票承兌人同；見票後定期付款之本票應提示見票。'],
['bn_14','bn_d','支票提示期限','§130、§131','發票地與付款地在同一省（市）區內者7日、不同者15日、國外2個月；未於期限內提示或作成拒絕證書者，對發票人以外之前手喪失追索權（§132）。'],
['bn_15','bn_d','遠期支票','§128 II','支票在票載發票日前，執票人不得為付款之提示。'],
['bn_16','bn_d','平行線與保付支票','§138、§139','平行線支票付款人僅得對金融業者支付；保付支票付款人付款責任與匯票承兌人同，發票人及背書人免除責任。']
],

SUBJ.securities={name:'證券交易法',color:'#8338ec',paper:'一試 綜合法學(二)・20分',
core:{t:'證交法解題主軸',a:'資訊揭露→公平交易→責任追究',k:'證交法以資訊公開為核心：發行市場看申報與公開說明書，交易市場看內線交易、操縱、短線交易；違反時追究民事賠償、刑事責任與投保中心團體訴訟。',m:'揭露・公平・責任'},
groups:{se_a:{n:'總則與發行',a:'§1–§43',k:'有價證券、公開發行、公開說明書、財報。'},se_b:{n:'公司治理',a:'§14-2–§26-3',k:'獨董、審計委員會、內部人、委託書。'},se_c:{n:'市場秩序',a:'§43-1、§155–§157-1',k:'公開收購、操縱、內線、短線。'},se_d:{n:'責任與救濟',a:'§20、§20-1、§171、投保法',k:'民事責任、刑事責任、團體訴訟。'}},
nodes:[
['se_1','se_a','有價證券','§6','政府債券、公開募集發行之股票、公司債及經主管機關核定之其他有價證券；新股認購權利證書、價款繳納憑證等視為有價證券。'],
['se_2','se_a','申報生效與公開說明書','§22、§30–§32','有價證券之募集發行應向主管機關申報生效；公開說明書主要內容有虛偽或隱匿者，發行人、負責人、承銷商、簽證專家等對善意相對人負賠償責任（§32）。'],
['se_3','se_a','財務報告','§36','公開發行公司應定期公告並申報經會計師查核簽證之年度財報、季報、月營運情形；重大事項應於事實發生之日起2日內公告。'],
['se_4','se_b','獨立董事與審計委員會','§14-2、§14-4','公開發行公司得依章程設置獨立董事，主管機關得命一定公司設置；審計委員會由全體獨立董事組成，取代監察人職權。'],
['se_5','se_b','內部人股權管理','§22-2、§25','董事、監察人、經理人及持股超過10%之股東轉讓持股須依規定方式（申報後向不特定人轉讓等）；持股變動應申報。'],
['se_6','se_b','委託書','§25-1','公開發行公司出席股東會使用委託書，應依主管機關規則辦理，禁止價購委託書。'],
['se_7','se_c','公開收購與大量持股','§43-1','取得公開發行公司已發行股份總額超過10%者，應於取得後10日內申報；預定取得一定比例以上股份者應採公開收購。'],
['se_8','se_c','操縱市場','§155','禁止相對委託、連續以高價買入或低價賣出、散布流言或不實資料、無實際成交意思之委託等操縱行為。'],
['se_9','se_c','內線交易','§157-1','內部人、基於職業或控制關係獲悉消息之人、喪失身分後未滿6個月者、消息受領人，於重大消息明確後、未公開前或公開後18小時內，不得買賣該公司股票；違反者對善意相對人負賠償責任。','明確後・公開前・18小時'],
['se_10','se_c','短線交易歸入權','§157','董事、監察人、經理人或持股超過10%之股東，取得後6個月內再行賣出，或賣出後6個月內再行買進，因而獲得利益者，公司應請求將其利益歸於公司。採無過失責任。'],
['se_11','se_d','證券詐欺與財報不實','§20、§20-1','有價證券募集發行買賣不得有虛偽、詐欺或足致他人誤信之行為；財報主要內容虛偽隱匿者，發行人負無過失責任，董事長總經理等負推定過失責任，會計師負過失責任（§20-1）。'],
['se_12','se_d','刑事責任','§171','違反操縱市場、內線交易、財報不實、特別背信等處3年以上10年以下有期徒刑；犯罪所得達新臺幣1億元以上者加重。'],
['se_13','se_d','投保中心團體訴訟與代表訴訟','投保法§28、§10-1','證券投資人及期貨交易人保護中心得受20人以上投資人授與訴訟實施權提起團體訴訟；並得為公司對董事、監察人提起代表訴訟或解任訴訟。']
],

SUBJ.enforcement={name:'強制執行法',color:'#fb5607',paper:'一試 綜合法學(二)・20分',
core:{t:'強執解題主軸',a:'執行名義→執行行為→救濟途徑',k:'有沒有合法的執行名義？執行標的與方法是否合法（查封、拍賣、扣押命令、禁止執行範圍）？對執行有爭議時，程序問題聲明異議，實體問題提起債務人異議之訴或第三人異議之訴。',m:'名義・執行・救濟'},
groups:{ex_a:{n:'總則與執行名義',a:'§1–§31',k:'執行名義、執行法院、拘提管收。'},ex_b:{n:'金錢債權執行',a:'§45–§122',k:'動產、不動產、債權執行與參與分配。'},ex_c:{n:'非金錢執行與保全',a:'§123–§140',k:'物之交付、行為不行為、假扣押假處分執行。'},ex_d:{n:'執行救濟',a:'§12–§18',k:'聲明異議、債務人異議之訴、第三人異議之訴。'}},
nodes:[
['ex_1','ex_a','執行名義','§4','確定終局判決；假扣押、假處分、假執行之裁判；依民訴成立之和解或調解；載明逕受強制執行之公證書；抵押權人質權人拍賣裁定；其他依法律得為執行名義者（如本票裁定、支付命令）。'],
['ex_2','ex_a','拘提管收','§21–§26','債務人有履行能力而故不履行、就應供強制執行之財產有隱匿處分情事等，執行法院得拘提、管收；管收期限不得逾3個月。'],
['ex_3','ex_b','參與分配','§32–§41','他債權人參與分配應於標的物拍賣或變賣終結或依法交債權人承受之日一日前為之；無執行名義之債權人限於有擔保物權或優先受償權者。對分配表有異議者得提起分配表異議之訴（§41）。'],
['ex_4','ex_b','動產與不動產執行','§45–§114','查封（§47、§75以下）、拍賣、點交（§99）；拍定人取得所有權於領得權利移轉證書時（§98）。查封後債務人之處分行為對債權人不生效力（§51 II）。'],
['ex_5','ex_b','禁止查封與維持生活','§52、§53、§122','債務人及其共同生活親屬維持生活所必需之物、職業上必需之器具等不得查封；維持生活所必需之債權不得為強制執行（§122）。'],
['ex_6','ex_b','債權執行','§115–§121','執行法院發扣押命令，並得發收取命令、移轉命令或支付轉給命令；對薪資等繼續性給付之扣押範圍不得逾各期給付數額三分之一（§115-1）。'],
['ex_7','ex_c','物之交付與行為不行為','§123–§129','交付動產不動產由執行法院取交或解除占有；可代替行為由第三人代履行，費用由債務人負擔（§127）；不可代替行為處怠金或拘提管收（§128）；不行為義務之違反得除去並處怠金（§129）。'],
['ex_8','ex_c','保全執行','§132–§140','假扣押、假處分之執行應於裁定送達同時或送達前為之；債權人收受裁定後已逾30日者不得聲請執行（§132 III）。'],
['ex_9','ex_d','聲明異議','§12','當事人或利害關係人對執行法院強制執行之命令、方法、實施程序或其他侵害利益之情事，得於強制執行程序終結前聲請或聲明異議；屬程序救濟。'],
['ex_10','ex_d','債務人異議之訴','§14','執行名義成立後有消滅或妨礙債權人請求之事由發生（如清償），債務人得於強制執行程序終結前提起；執行名義無確定判決同一效力者，成立前之事由亦得主張（§14 II）。'],
['ex_11','ex_d','第三人異議之訴','§15','第三人就執行標的物有足以排除強制執行之權利（如所有權、典權、留置權），得於強制執行程序終結前提起。'],
['ex_12','ex_d','停止執行','§18','強制執行程序開始後原則不停止；提起再審、異議之訴等，法院認有必要得命停止，並得命提供擔保。']
],

SUBJ.pil={name:'國際公法',color:'#118ab2',paper:'一試 綜合法學(一)・20分',
core:{t:'國際公法解題主軸',a:'法源→主體→義務→責任',k:'先找規範來源（條約、習慣國際法、一般法律原則）；確認主體（國家、國際組織、個人）；判斷義務是否被違反；最後處理國家責任與爭端解決。',m:'源・主體・違反・責任'},
groups:{pl_a:{n:'法源與主體',a:'國際法院規約§38',k:'法源、強行法、國家要件、承認。'},pl_b:{n:'國家管轄與豁免',a:'習慣法、公約',k:'領土、管轄、國家與外交豁免。'},pl_c:{n:'條約法',a:'1969維也納條約法公約',k:'締結、保留、無效、終止。'},pl_d:{n:'責任、武力與爭端',a:'ILC國家責任條款、聯合國憲章',k:'國家責任、使用武力、國際法院。'},pl_e:{n:'海洋法與人權',a:'UNCLOS、兩公約',k:'海域劃分、航行權、人權保障。'}},
nodes:[
['pl_1','pl_a','國際法法源','國際法院規約§38','條約、國際習慣（國家實踐＋法之確信）、一般法律原則；司法判決與權威學說為輔助。'],
['pl_2','pl_a','強行法','條約法公約§53','國際社會全體接受且公認為不許損抑之規範（如禁止侵略、種族滅絕、奴隸、酷刑）；與之牴觸之條約無效。'],
['pl_3','pl_a','國家要件與承認','蒙特維多公約§1','常住人民、確定領土、政府、與他國交往之能力。承認的性質有宣示說與構成說之爭；承認可明示或默示。'],
['pl_4','pl_b','領土取得','習慣國際法','先占（無主地＋有效占領）、添附、割讓、時效；以武力征服取得領土不被承認。'],
['pl_5','pl_b','國家管轄','習慣國際法','屬地、屬人（國籍）、保護、普遍管轄（海盜、戰爭罪等）；效果原則。'],
['pl_6','pl_b','國家豁免','限制豁免論','主權行為享有豁免，商業行為不享有豁免（限制豁免論）；我國有外國對中華民國法院管轄豁免法。'],
['pl_7','pl_b','外交與領事豁免','維也納外交關係公約','外交代表人身不可侵犯，享刑事管轄完全豁免與原則上的民事行政管轄豁免；使館館舍不可侵犯。領事豁免範圍較窄（限執行職務）。'],
['pl_8','pl_c','條約締結與保留','條約法公約§6–§23','條約之同意方式（簽署、批准、加入）；保留不得違反條約目的及宗旨，其他締約國可接受或反對。'],
['pl_9','pl_c','條約無效與終止','條約法公約§46–§64','無效事由：違反國內法重要規定且明顯、錯誤、詐欺、賄賂、強迫、牴觸強行法。情勢根本變遷得為終止理由但有嚴格限制（§62）。'],
['pl_10','pl_d','國家責任','ILC 2001年條款','國際不法行為＝可歸因於國家的作為或不作為＋違反國際義務；違法阻卻事由（同意、自衛、反措施、不可抗力、危難、危急情況）；責任形式為停止、賠償（回復原狀、補償、道歉）。'],
['pl_11','pl_d','禁止使用武力與自衛','聯合國憲章§2(4)、§51','禁止以武力威脅或使用武力；例外為安理會授權與遭受武力攻擊時之單獨或集體自衛（須必要、相稱並向安理會報告）。'],
['pl_12','pl_d','國際法院','國際法院規約','訴訟管轄以當事國同意為基礎（特別協定、條約管轄條款、任擇強制管轄聲明§36(2)）；得發表諮詢意見。'],
['pl_13','pl_e','海域劃分','UNCLOS','領海12浬、鄰接區24浬、專屬經濟區200浬、大陸礁層；公海自由。'],
['pl_14','pl_e','航行權','UNCLOS','外國船舶於領海享無害通過權；國際海峽之過境通行權；群島水域通過權。'],
['pl_15','pl_e','國際人權','兩公約施行法（2009）','公民與政治權利國際公約、經濟社會文化權利國際公約經我國以施行法國內法化，具國內法律效力。']
],

SUBJ.pvt={name:'國際私法',color:'#ef476f',paper:'一試 綜合法學(一)・20分',
core:{t:'涉外案件解題主軸',a:'涉外性→定性→連結因素→準據法→適用限制',k:'先確認有涉外因素並由我國法院管轄；依法庭地法定性；找出涉外民事法律適用法對應條文的連結因素（國籍、住所、行為地、物之所在地、意思自主）；再檢查反致、規避法律、公序良俗。',m:'涉外・定性・連結・反致・公序'},
groups:{pv_a:{n:'總則',a:'涉民法§1–§8',k:'國籍住所、反致、規避、公序良俗。'},pv_b:{n:'人與法律行為',a:'§9–§19',k:'權利能力、行為能力、方式、代理。'},pv_c:{n:'債與物權',a:'§20–§44',k:'契約、侵權、不當得利、物權。'},pv_d:{n:'親屬與繼承',a:'§45–§63',k:'婚姻、親子、繼承、遺囑。'}},
nodes:[
['pv_1','pv_a','本國法與國籍衝突','§2、§3','當事人有多數國籍時依關係最切之國籍定其本國法；無國籍者適用其住所地法（§3）。'],
['pv_2','pv_a','一國數法','§5','當事人本國法為一國數法時，依該國關於法規衝突之規定；無規定者適用關係最切之法律。'],
['pv_3','pv_a','反致','§6','依本法適用當事人本國法時，如依其本國法應適用其他法律者，應適用該其他法律；但依該其他法律更應適用其本國法或中華民國法律者，適用其本國法或中華民國法律。'],
['pv_4','pv_a','規避法律與公序良俗','§7、§8','當事人規避中華民國法律之強制或禁止規定者，仍適用該規定（§7）；適用外國法之結果有背於中華民國公共秩序或善良風俗者不適用（§8）。'],
['pv_5','pv_b','權利能力與行為能力','§9、§10','依其本國法；外國人依其本國法無行為能力或僅有限制行為能力，而依中華民國法律有行為能力者，就其在中華民國之法律行為視為有行為能力（§10 III，但親屬繼承及外國不動產除外）。'],
['pv_6','pv_b','法律行為方式與代理','§16–§19','法律行為方式依該行為所應適用之法律，或依行為地法亦為有效；意定代理之本人與相對人間依本人與相對人明示合意之法律，無合意者依關係最切之法律（§18）。'],
['pv_7','pv_c','契約','§20','依當事人意思定其應適用之法律；無明示意思或無效者依關係最切之法律，負擔特徵性債務之一方住所地法推定為關係最切（不動產契約推定不動產所在地法）。'],
['pv_8','pv_c','侵權行為','§25–§28','依侵權行為地法；另有關係最切之法律者依該法律。商品製造人責任（§26）、市場競爭（§27）、媒介侵權（§28）另有規定。'],
['pv_9','pv_c','無因管理與不當得利','§23、§24','無因管理依事務管理地法；不當得利依其利益之受領地法，但因給付而發生者依給付所由發生之法律關係應適用之法律。'],
['pv_10','pv_c','物權','§38','依物之所在地法；權利為標的之物權依權利成立地法；物之所在地變更時，其物權之得喪依原因事實完成時物之所在地法。'],
['pv_11','pv_d','婚姻成立與效力','§46、§47','婚姻成立依各該當事人之本國法；方式依當事人一方之本國法或舉行地法者亦為有效。婚姻效力依夫妻共同之本國法、共同住所地法、關係最切之法律。'],
['pv_12','pv_d','夫妻財產制與離婚','§48–§50','夫妻財產制得以書面合意選擇夫妻一方本國法或住所地法；離婚依協議時或起訴時夫妻共同之本國法、共同住所地法、關係最切之法律。'],
['pv_13','pv_d','親子關係','§51–§57','子女之身分依出生時該子女、其母或其母之夫之本國法為婚生子女者為婚生；父母與子女間法律關係依子女之本國法（§55）。'],
['pv_14','pv_d','繼承與遺囑','§58–§61','繼承依被繼承人死亡時之本國法；但依中華民國法律中華民國國民應為繼承人者，得就其在中華民國之遺產繼承之。遺囑成立效力依成立時遺囑人本國法。'],
['pv_15','pv_a','兩岸與港澳','臺灣地區與大陸地區人民關係條例、香港澳門關係條例','兩岸民事事件依兩岸條例§41以下（區際法律衝突）；涉港澳類推適用涉外民事法律適用法（港澳條例§38）。']
],

nodes:[
['et_1','et_a','律師使命','律師法§1','律師以保障人權、實現社會正義及促進民主法治為使命，應基於使命本於自律自治精神誠正信實執行職務。'],
['et_2','et_a','全國律師聯合會與入會','律師法（2020年修正）','律師執業應加入地方律師公會並同時為全國律師聯合會會員；未入會者不得執行律師職務。'],
['et_3','et_a','律師懲戒','律師法','違反律師法或倫理規範情節重大等，由律師懲戒委員會審議，覆審由律師懲戒覆審委員會；處分自命於一定期間內自行或參加研習、警告、申誡、停止執行職務至除名。'],
['et_4','et_b','忠誠與勤勉','律師倫理規範','律師應忠實蒐集證據、探究案情，並以專業知識勤勉執行委任事務，適時告知委任人事務進行之重要情事。'],
['et_5','et_b','保密義務','律師法、律師倫理規範','律師對於委任人、終止委任者及受任時知悉之事項，負保密義務；例外如經委任人同意、為避免重大危害、為自己辯護等必要情形。'],
['et_6','et_b','利益衝突','律師倫理規範','同一或有實質關聯之案件，不得同時或先後受利益相衝突之當事人委任；某些情形經告知並取得書面同意可受任。事務所成員利益衝突原則上有連帶效果。'],
['et_7','et_b','對法院之真實義務','律師倫理規範','律師不得就事實或法律為虛偽陳述，不得偽造變造證據、教唆偽證；但刑事辯護人不負積極揭露被告不利事實之義務。'],
['et_8','et_b','招攬與報酬','律師倫理規範','律師不得以不正當方法招攬業務，廣告不得虛偽誇大；報酬應合理並應事先說明，不得約定不當之後酬。'],
['et_9','et_c','審判獨立與公正','憲法§80、法官法','法官須超出黨派，依據法律獨立審判；應避免不當及易被認為不當之行為，維持公正中立之外觀。'],
['et_10','et_c','法官評鑑與懲戒','法官法§30以下','有違失行為者由法官評鑑委員會評鑑，移付職務法庭審理懲戒；職務法庭採二審。'],
['et_11','et_d','檢察一體與客觀性義務','法官法、刑訴§2','檢察官受上級指揮監督（檢察一體），但應依法獨立行使職權；對被告有利及不利之情形應一律注意（客觀性義務，刑訴§2）。'],
['et_12','et_d','檢察官倫理規範','檢察官倫理規範','偵查不公開、避免不當言論與關說、公正執行職務；違失適用檢察官評鑑與職務法庭懲戒。']
],

nodes:[
['en_1','en_a','侵權法基本概念','tort・civil wrong・tortfeasor','侵權行為(tort)是侵害個人的民事不法(civil wrong)，犯罪則是侵害社會的公共不法(public wrong)。加害人稱tortfeasor。英美侵權法三大類：過失(negligence)、故意侵權(intentional torts)、無過失責任(strict liability)；目的在填補損害並嚇阻潛在加害人。','侵權三分：過失、故意、無過失'],
['en_2','en_a','過失、注意義務與抗辯','negligence・duty of care・reasonable person','過失侵權要件：注意義務(duty of care)、違反(breach)、因果關係(causation)、損害(damages)，以合理之人(reasonable person)為標準。違反保護特定人群的法規而致該類事故，構成當然過失(negligence per se)，近似民法§184 II。抗辯：自甘冒險(assumption of the risk)、同意(consent)。','義務・違反・因果・損害'],
['en_3','en_a','故意侵權','trespass・false imprisonment・defamation・fraudulent misrepresentation','侵入土地(trespass；侵入者trespasser)、非法拘禁(false imprisonment，有合理脫離方法即不成立)、毆擊(battery)、威嚇(assault)、誹謗(defamation)、詐欺性不實陳述(fraudulent misrepresentation)。明知結果幾乎確定(substantially certain)發生，也算故意。'],
['en_4','en_a','滋擾與無過失責任','nuisance・strict liability・ultra-hazardous activities','滋擾(nuisance)：不合理干擾他人土地使用（如深夜噪音），或干擾公眾共同權利(public nuisance)。無過失責任(strict liability)不問有無過失。從事高度危險活動(ultra-hazardous activities)者的責任，我國民法§191-3採推定過失。'],
['en_5','en_a','替代責任與連帶責任','vicarious liability・joint and several liability','替代責任(vicarious liability)：因僱傭、代理等關係為他人的侵權負責，即使自己沒有過失（民法§188僱用人責任）。數人共同不法侵害他人權利者，連帶負責(joint and several liability，民法§185)。'],
['en_6','en_a','損害賠償的種類','compensatory・punitive・nominal damages','填補性賠償(compensatory damages)填補實際損害；懲罰性賠償(punitive damages)針對惡意、輕率、欺騙，在實際損害之外加給；名目賠償(nominal damages)是權利受侵害但無實際損失時的象徵性金額；非財產上損害(non-pecuniary loss)即慰撫金（民法§194、§195）。','填補・懲罰・名目'],
['en_7','en_b','要約、承諾與允諾禁反言','offer・acceptance・invitation to treat・promissory estoppel','要約(offer)經承諾(acceptance)成立契約；要約引誘(invitation to treat)不是要約。我國民法§154 II：貨物標定賣價陳列者視為要約。承諾期限屆至(§158)、拒絕、反要約(counter-offer)、撤回、要約人死亡，使承諾權(power of acceptance)消滅。是否為要約採客觀標準，看相對人(offeree)的合理理解。允諾禁反言(promissory estoppel)使受信賴的允諾有拘束力。','標價陳列＝要約'],
['en_8','en_b','契約效力與締約能力','void・voidable・capacity','無效(void)：自始不生效力，例如以不能之給付為標的（民法§246）。得撤銷(voidable)：例如因詐欺、不實陳述(misrepresentation)而締約。締約能力(capacity)欠缺：未成年、受監護、精神障礙、醉酒(intoxicated)。','無效・得撤銷・能力'],
['en_9','en_b','常見契約條款','force majeure・NDA・condition・adhesion・good faith','不可抗力條款(force majeure)、保密協議(non-disclosure agreement)、競業禁止(non-competition)、條件(condition：不確定事件，發生後給付才到期)、定型化契約(contract of adhesion，疑義作有利於相對人的解釋，保險法§54 II)、誠信原則(good faith)。'],
['en_10','en_b','違約金與危險負擔','liquidated damages・risk of loss','違約金(liquidated damages)：雙方預先約定違約時應支付的金額（民法§250）。危險負擔(risk of loss)：買賣標的物的利益及危險，自交付時起由買受人承受（民法§373）。'],
['en_11','en_b','第三人、債務更新與代理','third-party beneficiary・novation・power of attorney','利他契約(third-party beneficiary contract，民法§269)：A與B約定由B向C給付。債務更新(novation)：以新當事人取代原當事人，被取代者的權利義務消滅；delegation只移轉履行義務，assignment是債權讓與。授權書(power of attorney)使代理人以本人地位行為。'],
['en_12','en_c','董事義務與選任解任','duty of loyalty・cumulative voting・removal of directors','董事負忠實義務(duty of loyalty)與注意義務(duty of care)，有利益衝突時迴避（公司法§206準用§178）。董事得由股東會特別決議隨時解任(§199)，少數股東得訴請法院裁判解任(§200)；選舉採累積投票制(cumulative voting，§198)。獨立董事須具獨立性。'],
['en_13','en_c','股東權利與特別決議事項','derivative suit・special resolution・non-voting shares','股東代位訴訟(derivative suit，§214：繼續6個月以上持股1%以上)。讓與全部或主要部分的營業或財產須股東會特別決議(§185)。公開發行公司不得發行複數表決權、否決權、轉讓限制的特別股，也不適用表決權拘束契約，但可以發行無表決權特別股(§157 III、§175-1 III)。'],
['en_14','en_c','合併、關係企業與公司國籍','merger・short-form merger・appraisal rights・affiliates','合併須董事會作成合併契約並經股東會特別決議；反對股東有股份收買請求權(appraisal rights)。簡易合併(short-form merger)：母公司持有子公司90%以上，經董事會特別決議即可（公司法§316-2、企併法§19）。關係企業控制從屬(§369-2)；公司國籍依設立準據法（涉外民事法律適用法§13）。','90%簡易合併、反對股東收買'],
['en_15','en_c','證券發行與揭露','IPO・prospectus・private placement','公開發行(IPO)向金融監督管理委員會申報生效（證交法§22）；公開說明書(prospectus，§13)。現金增資保留員工承購（公司法§267）、提撥對外公開發行（證交法§28-1），其餘由原股東認購，沒有保留給董事。私募(private placement)只對特定人（§43-6）。'],
['en_16','en_c','證券交易規範','tender offer・short swing・proxy','公開收購(tender offer)：不經集中市場，公開向不特定人收購（§43-1）。短線交易歸入權(short swing，§157)：內部人6個月內買進賣出。委託書(proxy)徵求受規範；證交法透過資訊揭露、獨立董事等介入公司治理。'],
['en_17','en_d','犯罪成立與常見罪名','intent・negligence・justification・arson・smuggling','行為非出於故意或過失者不罰（刑法§12）；正當防衛(self-defense)是阻卻違法事由(justification)。常見罪名：強制性交(rape)、放火(arson)、走私(smuggling)、竊盜(theft)、侵占(embezzlement)、詐欺(fraud)、強盜(robbery)。'],
['en_18','en_d','刑罰目的與量刑','retribution・deterrence・rehabilitation・sentencing','刑罰目的：應報(retribution)、一般預防(general deterrence：嚇阻大眾)、特別預防(specific deterrence：隔離與威嚇本人)、再社會化(rehabilitation)；賠償(compensation)屬民事。量刑應符合比例原則、審酌刑法§57；被害人影響陳述(victim impact statements)。','應報・嚇阻・矯治'],
['en_19','en_d','搜索扣押與證據排除','search warrant・unreasonable searches・exclusionary rule','美國第4修正案禁止不合理搜索扣押(unreasonable searches and seizures)；搜索票須特定記載應搜索的處所與應扣押之物（我國刑訴§128 II）。違法搜索取得的證據排除(exclusionary rule)，衍生證據為毒樹果實(fruit of the poisonous tree)。'],
['en_20','en_d','被告權利與證據法則','self-incrimination・confrontation・confession・bail','不自證己罪(self-incrimination)、對質詰問權(confrontation)、交互詰問（反詰問必要時得誘導，刑訴§166-2）。自白(confession)不得為有罪判決的唯一證據（刑訴§156 II）；間接證據(circumstantial evidence)；保釋金(bail)不得過高（美國第8修正案）。'],
['en_21','en_e','審查基準與平等保護','scrutiny・suspect classification・equal protection','違憲審查依寬嚴分級：合理審查、較嚴格審查(heightened scrutiny)、嚴格審查(strict scrutiny，法院不尊重政府判斷)。性別分類(sex classifications)適用中度審查；性傾向分類應適用較為嚴格的審查（釋字748）。可疑分類(suspect classification)、分散孤立的少數(discrete and insular minorities)是平等保護用語。'],
['en_22','en_e','言論與宗教自由','prior restraint・clear and present danger・establishment clause','事前限制(prior restraint)推定違憲；明顯而立即危險(clear and present danger，釋字445)；強迫向國旗敬禮違憲(Barnette, 1943)；Citizens United (2010)推翻Austin；第1修正案禁止國家設立宗教(establishment of religion)。'],
['en_23','en_e','正當程序與基本權限制','due process・incorporation・takings・Article 23','實質正當程序(substantive due process)：侵害基本自由須為達成重大利益而嚴密剪裁。第14修正案將權利法案併入(incorporation)適用於各州。徵收(takings)：Cedar Point (2021)認定法規允許進入農地屬占用私有財產。我國憲法§23：限制基本權須為防止妨礙他人自由、避免緊急危難、維持社會秩序或增進公共利益所必要。'],
['en_24','en_e','政府體制與權力分立','checks and balances・commerce clause・recall・emergency decree','權力制衡(checks and balances)、司法審查(judicial review)、禁止溯及既往(ex post facto)是對政府權力的限制。美國國會依商業條款(Commerce Clause)規範對州際商業有實質影響的活動。我國憲法§17選舉、罷免(recall)、創制、複決；緊急命令須於發布後10日內提交立法院追認(ratification，增修條文§2 III)。政黨傑利蠑螈(partisan gerrymandering)。'],
['en_25','en_e','憲法訴訟','standing・injury in fact・constitutional complaint','美國憲法第3條的訴訟權能(standing)：須有具體的事實上損害(injury in fact)、因果關係與可救濟性。我國憲法訴訟法§59：用盡審級救濟後，得對確定終局裁判聲請裁判憲法審查(constitutional complaint)。'],
['en_26','en_f','起訴、訴訟類型與ADR','complaint・class action・statute of limitations・ADR','原告以起訴狀(complaint)開啟訴訟；團體訴訟(class action)；時效(statute of limitations)；法庭之友意見書(amicus brief)；替代性紛爭解決(alternative dispute resolution：仲裁arbitration、調解mediation)。'],
['en_27','en_f','審理與舉證','burden of proof・directed verdict・recusal','主張有利於己之事實者負舉證責任（民訴§277），時效完成由被告主張。指示判決(directed verdict)：證據不足以讓合理陪審團作不同結論時，由法官逕為裁判。法官有偏頗之虞應迴避(recuse)。'],
['en_28','en_f','判決效力與法院意見','res judicata・moot・concurring opinion・stare decisis','既判力(res judicata)：確定判決後，同一當事人不得就同一訴訟標的再訴。訴訟無實益(moot)。協同意見書(concurring opinion：同意結論、不同意理由)、不同意見書(dissenting opinion)。判決先例拘束(stare decisis)。','協同同結論、不同意見反結論']
],
qb:[]};

function vivid(hex){ const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return hex; const n=parseInt(m[1],16); let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0,l=(mx+mn)/2,sat=d?d/(1-Math.abs(2*l-1)):0;
  if(d) h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; if(l>=0.62||sat<0.05) return hex; l=0.64; sat=Math.min(1,sat*1.05);
  const c=(1-Math.abs(2*l-1))*sat,x=c*(1-Math.abs(h/60%2-1)),o=l-c/2; const [a,e,f]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+[a,e,f].map(v=>Math.round((v+o)*255).toString(16).padStart(2,'0')).join(''); }

function effTxt(e){ e=String(e||''); const d=e.match(/\d{4}-\d{2}-\d{2}/); return d?'施行 '+d[0]:e.split(/[；;]/)[0].slice(0,40); }

      if(ok) bx.push([X0,Y0,X0+w,Y0+h]); else if(+el.style.opacity>0.12){ el.style.opacity='0.12'; d.o._op='0.12'; } const tr='translate('+(X0+w/2).toFixed(1)+'px,'+(Y0+1.5*h).toFixed(1)+'px) translate(-50%,-150%)'; if(d.o._tr!==tr){ el.style.transform=tr; d.o._tr=tr; } }); }
  if(lq.length){ const pl=[], VW=window.innerWidth; if(nodes.core&&+nodes.core.el.style.opacity>0.3){ const c=nodes.core.el.getBoundingClientRect(); pl.push([c.left,c.top,c.right,c.bottom]); }
    lq.sort((a,b)=>b.p-a.p).forEach(d=>{ const el=d.o.el; if(d.o._wk!==el.className+el.textContent){ d.o._w=el.offsetWidth; d.o._h=el.offsetHeight; d.o._wk=el.className+el.textContent; }
      const l=clamp(d.x-d.o._w/2,4,Math.max(4,VW-4-d.o._w)), t=d.y-1.5*d.o._h, r=l+d.o._w, b=t+d.o._h;
      if(pl.some(q=>l<q[2]+3&&r>q[0]-3&&t<q[3]+1&&b>q[1]-1)){ if(d.o._op!=='0.06'){ el.style.opacity='0.06'; d.o._op='0.06'; } }
      else { pl.push([l,t,r,b]); if(Math.abs(l-(d.x-d.o._w/2))>0.5){ const tr='translate('+(l+d.o._w/2).toFixed(1)+'px,'+d.y.toFixed(1)+'px) translate(-50%,-150%)'; if(d.o._tr!==tr){ el.style.transform=tr; d.o._tr=tr; } } } }); }
  if(selRing) selRing.scale.setScalar(selRing.userData.sz*(1+0.12*Math.sin(t*3.2)));
  renderer.render(scene,camera);
}
