<header><div><a href="index.html">← 法學記憶宇宙首頁</a><h1>民法申論樣品（預覽）</h1><div class="muted">5 題考選部試題 · 3 組法條組合包 · 債總、債各、親屬繼承。</div><div id="status" class="status" role="status"></div><nav aria-label="模組導覽"><a href="#questions">題目列表</a><a href="#packs">組合包</a><a href="#reverse">哪些考題用到</a><a href="#mindmap">蜂巢記憶地圖</a></nav></div></header><main id="main"></main>
<script>
/* Local-only learning journey; all legal detail comes from the existing graph. */
(function(global){
'use strict';
const KEY='lawu-civil-v2-neuron-journey-v1',subjects=['債總','債各','親屬繼承'];
function create(graph){
 let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{};}catch{}
 const state={done:true,unlocked:[...subjects],seen:Array.isArray(saved.seen)?saved.seen.filter(k=>graph.nodes.some(n=>n.kind==='question'&&n.key===k)):[]};
 const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}};
 const subject=n=>subjects.find(s=>String(n.obj.category||n.obj.subject||'').includes(s));
 const neighbors=n=>graph.edges.flatMap(([a,b])=>a===n.key?[b]:b===n.key?[a]:[]).map(k=>graph.nodes.find(n=>n.key===k));
 const banned=new Set(['B0000001-77','B0000001-93','B0000001-779','B0000001-831','C0000001-222','C0000001-268','C0000001-319-4']);
 const candidates=graph.nodes.filter(n=>n.kind==='question'&&subject(n)===subjects[0]).flatMap(q=>neighbors(q).filter(n=>n.kind==='issue'&&n.label!==q.label.replace(/ \d+$/,'')).flatMap(issue=>neighbors(issue).filter(n=>n.kind==='article'&&!banned.has(n.id)&&(n.obj.cases||n.obj.practice||[]).length&&neighbors(n).some(v=>v.kind==='question'&&v.key!==q.key&&subject(v)===subjects[0])).map(article=>({q,issue,article,pack:neighbors(q).find(n=>n.kind==='pack')})))).filter(c=>c.pack);
 const sample=candidates[0];let step=0,passed=false,draw,detail,getView,setView;
 const $=s=>document.querySelector(s);
 function options(){chips();const select=$('#mm-subject');if(!select)return;[...select.options].forEach((o,i)=>{o.disabled=!state.unlocked.includes(subjects[i]);o.textContent=(o.disabled?'🔒 ':'')+subjects[i];});if(select.selectedOptions[0]?.disabled)select.value=subjects[0];const count=graph.nodes.filter(n=>n.kind==='question'&&subject(n)===select.value&&state.seen.includes(n.key)).length;$('#mm-progression').textContent=select.value+'：已探索 '+Math.min(3,count)+'/3 題，'+(state.unlocked.length===subjects.length?'所有科目已解鎖。':'點選不同藍格解鎖下一科。');}
 function chips(){const box=$('#mm-subjects');if(!box)return;box.replaceChildren(...subjects.map((sub,i)=>{const b=document.createElement('button'),open=state.unlocked.includes(sub),prev=subjects[i-1],count=graph.nodes.filter(n=>n.kind==='question'&&subject(n)===prev&&state.seen.includes(n.key)).length;b.textContent=open?sub+' ✓':'🔒 '+sub+'（再看 '+Math.max(0,3-count)+' 題）';b.onclick=()=>{if(open){$('#mm-subject').value=sub;$('#mm-subject').dispatchEvent(new Event('change'));}else{$('#mm-toast').hidden=false;$('#mm-toast-text').textContent='先在'+prev+'點選 3 個不同藍格，即可解鎖'+sub+'。';}};return b;}));}
 function visit(n){if(step||n.kind!=='question')return;const sub=subject(n);if(!state.unlocked.includes(sub))return;if(!state.seen.includes(n.key))state.seen.push(n.key);if(graph.nodes.filter(v=>v.kind==='question'&&subject(v)===sub&&state.seen.includes(v.key)).length>=3){const next=subjects[subjects.indexOf(sub)+1];if(next&&!state.unlocked.includes(next))state.unlocked.push(next);}persist();}
 function allowed(active){const seeds=graph.nodes.filter(n=>n.kind==='question'&&state.unlocked.includes(subject(n))),open=new Set(seeds.flatMap(n=>[n,...neighbors(n)]).filter(n=>n.kind!=='question'||state.unlocked.includes(subject(n))).map(n=>n.key));return new Set([...active].filter(k=>open.has(k)));}
 function finish(skipped){step=0;state.done=true;persist();$('#mm-tutorial').hidden=false;$('#mm-tutorial').innerHTML='<strong>'+(skipped?'已跳過教學':'教學完成')+'</strong> · 點任一藍格開始，再看 3 題解鎖下一科。';controls(false);options();draw();getView()?.reset();requestAnimationFrame(()=>$('#mm-tutorial').scrollIntoView({block:'start'}));}
 function controls(disabled){['#mm-subject','#mm-search','#mm-fit','#mm-in','#mm-out'].forEach(s=>$(s).disabled=disabled);$('#mm-guide').open=false;$('#mm-progression').hidden=disabled;$('#mm-stage').classList.toggle('mm-learning',disabled);document.body.classList.toggle('learning',disabled);if(disabled){$('#mm-subject').value=subjects[0];$('.mm-menu').open=false;} }
 function show(){
  if(!sample)return;getView()?.destroy();controls(true);$('#mm-detail').hidden=true;
  const {q,issue,article,pack}=sample,other=neighbors(article).find(n=>n.kind==='question'&&n.key!==q.key&&subject(n)===subjects[0]);
  const nodes=[q,...(step>=2?[issue]:[]),...(step>=3?[article]:[]),...(step>=4?[other]:[]),...(step>=5?[pack]:[])],keys=new Set(nodes.map(n=>n.key));
  const titles=['認識一格蜂巢','找出爭點','找到法條','發現相鄰的關係','組合包'],messages=['請點發亮的藍格看題目。前面的數字是考試年度（民國）。','這題在吵什麼？請點一下橘格。','請點一下綠格，閱讀條號與資料中的說明。','請點新出現的藍格：另一題也用到這條法條。','請點紫格：常一起考的法條打包成一組。'];
  passed=false;const card=$('#mm-tutorial');card.hidden=false;card.innerHTML=`<p>新手教學 ${step}/5</p><progress max="5" value="${step}" aria-label="教學進度"></progress><h3>${titles[step-1]}</h3><p>${messages[step-1]}</p><p id="mm-feedback" role="status"></p><button id="mm-next" ${passed?'':'disabled'}>${step===5?'完成教學':'下一步'}</button> <button id="mm-skip">跳過教學</button>`;
  $('#mm-count').textContent=`教學 ${step}/5 · ${nodes.length} 節點`;
  setView(global.LawMindmap.mount($('#mm-stage'),{tutorial:true,nodes,edges:graph.edges.filter(([a,b])=>keys.has(a)&&keys.has(b))},n=>{const target=[q,issue,article,other,pack][step-1];if(n.key!==target.key){$('#mm-feedback').textContent='這格是'+({question:'題目',issue:'爭點',article:'法條',pack:'組合包'}[n.kind])+'，請找發亮的'+(['藍','橘','綠','藍','紫'][step-1])+'格。';const c=$('#mm-tutorial');c.classList.remove('mm-nudge');void c.offsetWidth;c.classList.add('mm-nudge');return;}passed=true;$('#mm-next').disabled=false;const raw=step===1?(q.obj.prompt_text||q.obj.stem_text||q.label):step===2?(issue.obj.description||issue.label):step===3?(article.obj.plain_requirements||article.obj.text||article.label):step===4?(other.obj.prompt_text||other.label):(pack.obj.description||pack.label);$('#mm-feedback').textContent='✔ 做得好 · '+(Array.isArray(raw)?raw[0]:raw); }));
  const target=[q,issue,article,other,pack][step-1];document.querySelectorAll('#mm-stage [role=button]').forEach(g=>g.classList.toggle('mm-target',g.dataset.key===target.key));
  requestAnimationFrame(()=>window.scrollTo(0,0));
 $('#mm-next').onclick=()=>{if(!passed)return;if(step===5)finish(false);else{step++;show();}};$('#mm-skip').onclick=()=>finish(true);
 }
 function bind(d,dt,g,s){draw=d;detail=dt;getView=g;setView=s;$('#mm-direct-unlock').onclick=()=>$('#mm-unlock').click();$('#mm-replay').onclick=()=>{step=1;show();};$('#mm-unlock').onclick=()=>{state.unlocked=[...subjects];persist();options();if(step)finish(true);else draw();};if(!state.done){step=1;show();}}
 return {visit,options,allowed,bind,seen:key=>state.seen.includes(key)};
}
global.LawJourney={create};
})(window);

</script>
<script src="classic/vendor/mindmap.js" integrity="sha384-7tSmUcAAC8gxceZNdgDfKSAzVD/dAQf/dMJrZkcAPtUC6lcyVsej4s7+hJJ0Vnjk" crossorigin="anonymous"></script>
<script>
'use strict';
const DEMO={questions:[{id:'demo-q1',title:'一物二賣的請求權分析（示範）',subject:'民法',content:'【介面示範，非正式考題】甲將物品出售給乙，嗣後又交付給丙。乙可以如何主張權利？',issues:[{title:'契約義務與不履行',description:'先辨識契約義務，再依給付障礙與可歸責性分析。',articleIds:['demo-a1','demo-a2']}],packIds:['demo-p1']}],packs:[{id:'demo-p1',title:'買賣與給付障礙（示範）',description:'練習從契約義務連結損害賠償。',articleIds:['demo-a1','demo-a2'],questionIds:['demo-q1']}],articles:[{id:'demo-a1',law:'民法',number:'348',title:'出賣人義務',text:'【示範摘要，非條文全文】出賣人負有交付標的物及移轉所有權等義務。',requirements:['辨識契約當事人','確認約定的給付內容'],practice:['示範欄位：正式實務見解待資料完成後載入。'],issues:['債權契約與物權變動的區分'],relatedArticleIds:['demo-a2']},{id:'demo-a2',law:'民法',number:'226',title:'給付不能',text:'【示範摘要，非條文全文】因可歸責於債務人之事由致給付不能時，涉及損害賠償。',requirements:['給付不能','可歸責事由','損害及因果關係'],practice:[],issues:['給付不能與其他給付障礙的區別'],relatedArticleIds:['demo-a1']}]};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), arr=v=>v==null?[]:Array.isArray(v)?v:[v];
const pick=(o,...keys)=>keys.map(k=>o[k]).find(v=>v!=null), refs=(o,type)=>arr(pick(o,type+'Ids',type.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())+'_ids',type+'s',type.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())+'s')).map(v=>String(typeof v==='object'?v.id:v));
function normalize(raw){if(!raw||!['questions','packs','articles'].every(k=>Array.isArray(raw[k])))throw Error('需要 questions、packs、articles 三個陣列');const d={};for(const k of ['questions','packs','articles']){d[k]=raw[k].map((v,i)=>({...v,id:String(v.id??k+'-'+i)}));if(new Set(d[k].map(v=>v.id)).size!==d[k].length)throw Error('資料 ID 重複');}return d;}
let data=DEMO,source='示範資料｜正式資料尚未完成',search='';
try{const saved=JSON.parse(localStorage.getItem('lawu-civil-v2-essay-data'));if(saved){data=normalize(saved);source='真實資料｜使用已儲存的離線副本';}}catch(e){}
const title=o=>pick(o,'title','name','label')||o.id;
const label=a=>a.label||[a.law,a.article_no?'第'+a.article_no+'條':title(a)].filter(Boolean).join('');
function link(kind,id,text){return `<a href="#${kind}/${encodeURIComponent(id)}">${esc(text)}</a>`;}
function articleLinks(ids){return `<div class="links">${ids.length?ids.map(id=>{const a=data.articles.find(a=>a.id===id);return link('article',id,a?label(a):id+'（資料未提供）');}).join(''):'<span class="muted">尚無關聯條文</span>'}</div>`;}
function issueArticles(q){return [...new Set([...refs(q,'article'),...arr(q.issues).flatMap(i=>typeof i==='object'?refs(i,'article'):[])])];}
function questionArticles(q){return [...new Set([...issueArticles(q),...data.packs.filter(p=>refs(q,'pack').includes(p.id)||refs(p,'question').includes(q.id)).flatMap(p=>refs(p,'article'))])];}
function usedQuestions(a){return data.questions.filter(q=>questionArticles(q).includes(a.id)||refs(a,'question').includes(q.id));}
function usedPacks(a){return data.packs.filter(p=>refs(p,'article').includes(a.id)||refs(a,'pack').includes(p.id));}
function text(v){if(v==null||arr(v).length===0)return '<p class="muted">尚未提供</p>';return arr(v).map(x=>`<p>${esc(typeof x==='object'?Object.entries(x).map(([k,v])=>`${k}：${typeof v==='object'?JSON.stringify(v):v}`).join('\n'):x)}</p>`).join('');}
function cards(items,kind){return items.length?items.map(o=>`<a class="card" href="#${kind}/${encodeURIComponent(o.id)}"><span>${esc(o.subject||o.category||'申論練習')}</span><strong>${esc(kind==='article'?label(o):kind==='question'?questionLabel(o):title(o))}</strong><span>${esc(o.description||o.summary||'查看內容與關聯')}</span></a>`).join(''):'<p class="empty">目前沒有符合的資料。</p>';}
function block(heading,body){return `<section><h3>${heading}</h3>${body}</section>`;}
let mapView=null;
function render(){mapView?.destroy();mapView=null;if(!location.hash||location.hash==='#'){history.replaceState(null,'','#questions');}const [page='questions',encoded='']=location.hash.slice(1).split('/');let id;try{id=decodeURIComponent(encoded);}catch(e){id='';}let html='';for(const a of document.querySelectorAll('nav a'))a.setAttribute('aria-current',a.hash==='#'+page?'page':'false');
if(page==='mindmap'){renderMindmap(id);$('#status').textContent=source;return;}
if(page==='questions'){html=`<h2 tabindex="-1">題目列表</h2><p class="flow">題目 → 爭點 → 法條 → 關聯法條</p><label for="search">搜尋題目、科目與內容</label><input id="search" type="search" value="${esc(search)}" placeholder="輸入關鍵字"><div id="results">${cards(data.questions.filter(q=>JSON.stringify(q).toLowerCase().includes(search.toLowerCase())),'question')}</div>`;}
else if(page==='packs'){html='<h2 tabindex="-1">組合包列表</h2>'+cards(data.packs,'pack');}
else if(page==='reverse'){html=`<h2 tabindex="-1">哪些考題用到</h2><p class="muted">選一條法條，查看哪些題目與組合包使用它。</p><label for="search">搜尋法規、條號或關鍵字</label><input id="search" type="search" value="${esc(search)}" placeholder="例如：民法、348"><div id="results">${reverseResults()}</div>`;}
else {const collection={question:'questions',pack:'packs',article:'articles'}[page],o=collection&&data[collection].find(x=>x.id===id);if(!o)html='<h2 tabindex="-1">找不到這筆資料</h2><a href="#questions">返回題目列表</a>';else if(page==='question'){html=`<a class="back" href="#questions">← 題目列表</a><h2 tabindex="-1">${esc(page==='question'?questionLabel(o):title(o))}</h2><p class="flow">① 題目 → ② 爭點 → ③ 法條 → ④ 關聯法條</p>${block('① 題目',text(pick(o,'content','question','text','body','stem_text'))+text(o.prompt_text))}${block('② 爭點',arr(o.issues).map((i,n)=>`<h3>${n+1}. ${esc(typeof i==='string'?i:pick(i,'title','name','issue')||'爭點')}</h3>${typeof i==='object'?text(pick(i,'description','analysis','content'))+articleLinks(refs(i,'article')):''}`).join('')||text(null))}${block('③ 適用法條',articleLinks(questionArticles(o)))}${block('④ 關聯法條',articleLinks([...new Set(data.articles.filter(a=>questionArticles(o).includes(a.id)).flatMap(a=>refs(a,'relatedArticle')))]))}`;}
else if(page==='pack'){const qs=data.questions.filter(q=>refs(o,'question').includes(q.id)||refs(q,'pack').includes(o.id));html=`<a class="back" href="#packs">← 組合包列表</a><h2 tabindex="-1">${esc(page==='question'?questionLabel(o):title(o))}</h2>${text(o.description)}${block('組合法條',articleLinks(refs(o,'article')))}${block('練習題目',cards(qs,'question'))}`;}
else{html=`<a class="back" href="#reverse">← 哪些考題用到</a><h2 tabindex="-1">${esc(label(o))}</h2>${block('條文',text(pick(o,'text','content','fullText','full_text')))}${block('什麼情況適用（要件）',text(pick(o,'requirements','elements','plain_requirements')))}${block('法院怎麼判（實務見解）',text(pick(o,'practice','opinions','cases','judicialOpinions')))}${block('常考的問題（爭點）',text(pick(o,'issues','commonIssues','common_issues')))}${block('關聯條文',articleLinks(refs(o,'relatedArticle')))}${block('哪些考題用到這條',cards(usedQuestions(o),'question'))}${block('哪些組合包用到這條',cards(usedPacks(o),'pack'))}`;}}
if(['question','pack','article'].includes(page)&&id)html+=`<p>${link('mindmap',page+':'+id,'把這個放中間看')}</p>`;$('#main').innerHTML=html;$('#status').textContent=source;const input=$('#search');if(input)input.oninput=()=>{search=input.value;$('#results').innerHTML=page==='reverse'?reverseResults():cards(data.questions.filter(q=>JSON.stringify(q).toLowerCase().includes(search.toLowerCase())),'question');};}
function reverseResults(){return data.articles.filter(a=>JSON.stringify(a).toLowerCase().includes(search.toLowerCase())).map(a=>`<a class="card" href="#article/${encodeURIComponent(a.id)}"><strong>${esc(label(a))}</strong><span>${usedQuestions(a).length} 題目 · ${usedPacks(a).length} 組合包</span></a>`).join('')||'<p class="empty">找不到符合的法條。</p>';}
window.addEventListener('hashchange',()=>{search='';render();window.scrollTo(0,0);$('#main h2')?.focus();});

// Network labels use only source fields; never fall back to internal IDs.
function questionLabel(q){
 const issues=arr(q.issues).map(i=>typeof i==='string'?i:pick(i,'title','name','issue')).filter(Boolean);
 const topic=pick(q,'topic','theme','title','name','label')||issues.find(t=>!/^第\s*[\d一二三四五六七八九十]+/.test(t))||issues[0]||pick(q,'prompt_text','stem_text','content','question','text','body')||'';
 return [topic,pick(q,'year_roc','year','年度')].filter(v=>v!=null&&v!=='').join(' ');
}
function mapGraph(){
 const nodes=[],edges=[],seen=new Map(),pairs=new Set();
 const add=(kind,obj)=>{const key=kind+':'+obj.id;if(!seen.has(key)){const n={key,kind,id:obj.id,obj,label:kind==='question'?questionLabel(obj):kind==='article'?label(obj):title(obj)};seen.set(key,n);nodes.push(n);}return key;};
 const edge=(a,b)=>{if(a===b||!seen.has(a)||!seen.has(b))return;const key=[a,b].sort().join('|');if(!pairs.has(key)){pairs.add(key);edges.push([a,b]);}};
 data.questions.forEach(o=>add('question',o));data.packs.forEach(o=>add('pack',o));data.articles.forEach(o=>add('article',o));
 data.questions.forEach(q=>{arr(q.issues).forEach((i,index)=>{const obj=typeof i==='string'?{title:i}:i;const key=add('issue',{...obj,id:q.id+':'+index,category:q.category});edge('question:'+q.id,key);[...refs(obj,'article'),...refs(obj,'relatedArticle')].forEach(id=>edge(key,'article:'+id));});questionArticles(q).forEach(id=>edge('question:'+q.id,'article:'+id));refs(q,'pack').forEach(id=>edge('question:'+q.id,'pack:'+id));});
 data.packs.forEach(p=>{refs(p,'article').forEach(id=>edge('pack:'+p.id,'article:'+id));refs(p,'question').forEach(id=>edge('pack:'+p.id,'question:'+id));});
 data.articles.forEach(a=>{refs(a,'relatedArticle').forEach(id=>edge('article:'+a.id,'article:'+id));refs(a,'question').forEach(id=>edge('article:'+a.id,'question:'+id));refs(a,'pack').forEach(id=>edge('article:'+a.id,'pack:'+id));});
 return {nodes,edges};
}
function mapDetails(n){
 if(n.kind==='issue')return `<h3>${esc(n.label)}</h3>${text(pick(n.obj,'description','analysis','content'))}${articleLinks([...refs(n.obj,'article'),...refs(n.obj,'relatedArticle')])}`;
 // Reuse the full detail renderer in a detached container, then restore the network.
 const main=$('#main'),saved=document.createElement('div'),view=mapView,hash=location.hash;
 while(main.firstChild)saved.append(main.firstChild);
 mapView=null;history.replaceState(null,'','#'+n.kind+'/'+encodeURIComponent(n.id));render();
 if(n.kind==='question')main.querySelector('h2').textContent=n.label;
 const html=main.innerHTML;main.replaceChildren(...saved.childNodes);history.replaceState(null,'',hash);mapView=view;document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#mindmap'?'page':'false'));
 return html;
}
function renderMindmap(requested){
 const graph=mapGraph();let overview=false,automatic=false;
 const journey=window.LawJourney.create(graph);
 $('#main').innerHTML=`<h2 tabindex="-1">蜂巢記憶地圖：從一題看懂法條連結</h2><details class="mm-guide" id="mm-guide" open><summary>怎麼看這張圖</summary><ol><li>每格六角形是一個東西：藍＝考古題、橘＝爭點、綠＝法條、紫＝組合包。顏色對照在下方，隨時看得到。</li><li>相鄰代表有關聯：中央是目前選取的內容，蜂蜜色粗框是直接關聯，外圈再延伸一層。超過六筆可切換下一組關聯。</li><li>點一下任何蜂巢格，看它的名稱與相連內容；先挑一個藍格開始。</li></ol></details><details class="mm-menu"><summary>選單／設定</summary><button id="mm-replay">重玩教學</button><button id="mm-unlock">全部解鎖</button><p>進度只儲存在這台裝置，不上傳。</p></details><div id="mm-subjects" class="mm-subjects"></div><div id="mm-toast" hidden role="status"><span id="mm-toast-text"></span> <button id="mm-direct-unlock">直接全部解鎖</button></div><div class="mm-controls"><select id="mm-subject" aria-label="科目"><option>債總</option><option>債各</option><option>親屬繼承</option></select><input type="search" id="mm-search" aria-label="搜尋蜂巢" placeholder="搜尋蜂巢"><button id="mm-in" aria-label="放大">＋</button><button id="mm-out" aria-label="縮小">－</button><button id="mm-fit">科目總覽</button></div><div class="mm-legend"><span class="kind-question">● 考古題</span><span class="kind-issue"><b style="color:#E07B24">●</b> 爭點（題目在吵什麼）</span><span class="kind-article">● 法條（深綠＝常考）</span><span class="kind-pack">● 組合包</span></div><p id="mm-count" aria-live="polite"></p><p id="mm-progression" aria-live="polite"></p><div class="mm-layout"><div class="mm-stage" id="mm-stage"></div><section id="mm-tutorial" hidden aria-live="polite"></section><aside id="mm-detail" aria-live="polite" hidden></aside></div><p class="mm-help">點一下蜂巢格看內容・兩指放大縮小</p>`;
 try{$('.mm-help').hidden=sessionStorage.getItem('lawu-civil-v2-map-hint')==='1';}catch{}const guide=$('#mm-guide');try{guide.open=false;}catch{}guide.addEventListener('toggle',()=>{try{localStorage.setItem('lawu-civil-v2-mindmap-guide-collapsed',guide.open?'0':'1');}catch{}});
 const example=n=>n.kind==='question'?`<div class="mm-example"><h3>這題考什麼 → 用到哪些法條</h3><p><strong>${esc(n.label)}</strong></p><p>這題考什麼：${arr(n.obj.issues).map(i=>esc(typeof i==='string'?i:pick(i,'title','name'))).join('、')||esc(n.label)}</p><p>用到哪些法條：</p>${articleLinks(questionArticles(n.obj))}</div>`:'';
 const detail=n=>{if(!n){$('#mm-detail').hidden=true;return;}const hint=$('.mm-help');if(hint)hint.hidden=true;try{sessionStorage.setItem('lawu-civil-v2-map-hint','1');}catch{}if(!automatic){journey.visit(n);if(n.kind==='question'){n.seen=true;const g=[...document.querySelectorAll('#mm-stage [role=button]')].find(g=>g.dataset.key===n.key);if(g&&!g.querySelector('.mm-seen')){g.classList.remove('mm-unseen');const badge=document.createElementNS('http://www.w3.org/2000/svg','text');badge.setAttribute('class','mm-seen');badge.setAttribute('x',9);badge.setAttribute('y',-9);badge.setAttribute('fill','#256445');badge.textContent='✓';g.append(badge);}}}journey.options();const panel=$('#mm-detail');panel.hidden=false;panel.classList.remove('expanded');panel.innerHTML='<div class="mm-peek"><button id="mm-expand" aria-expanded="false">看詳細 ▲</button><button id="mm-close">關閉 ×</button><strong>'+esc(n.label)+'</strong></div><div class="mm-detail-body">'+example(n)+mapDetails(n)+'</div>';$('#mm-expand').onclick=()=>{const open=panel.classList.toggle('expanded');$('#mm-expand').setAttribute('aria-expanded',open);$('#mm-expand').textContent=open?'收起預覽 ▼':'看詳細 ▲';};$('#mm-close').onclick=()=>{panel.hidden=true;mapView.refresh();};mapView.refresh();if(innerWidth<=600)requestAnimationFrame(()=>$('#mm-stage').scrollIntoView({block:'start'}));};
 const draw=()=>{mapView?.destroy();const subject=$('#mm-subject').value,query=$('#mm-search').value.trim().toLowerCase();
 let active=new Set();
 if(overview)graph.nodes.forEach(n=>active.add(n.key));
 else if(requested){active.add(requested);graph.edges.forEach(([a,b])=>{if(a===requested)active.add(b);if(b===requested)active.add(a);});}
 else {const seeds=new Set(graph.nodes.filter(n=>n.kind==='question'&&String(n.obj.category||n.obj.subject||'').includes(subject)&&(!query||JSON.stringify(n.obj).toLowerCase().includes(query))).map(n=>n.key));
 if(query)graph.nodes.filter(n=>JSON.stringify(n.obj).toLowerCase().includes(query)&&String(n.obj.category||'').includes(subject)).forEach(n=>seeds.add(n.key));
 seeds.forEach(k=>active.add(k));graph.edges.forEach(([a,b])=>{if(seeds.has(a))active.add(b);if(seeds.has(b))active.add(a);});}
 if(requested){for(let hop=0;hop<2;hop++){const old=new Set(active);graph.edges.forEach(([a,b])=>{if(old.has(a))active.add(b);if(old.has(b))active.add(a);});}} active=journey.allowed(active);const g={overview,nodes:graph.nodes.filter(n=>active.has(n.key)).map(n=>({...n,seen:journey.seen(n.key)})),edges:graph.edges.filter(([a,b])=>active.has(a)&&active.has(b))};$('#mm-count').textContent=`${overview?'全網路（無文字）':requested?'單題／節點中心':subject} · ${g.nodes.length} / ${graph.nodes.length} 節點`;$('#mm-detail').hidden=true;mapView=window.LawMindmap.mount($('#mm-stage'),g,detail);automatic=true;if(requested&&active.has(requested))mapView.select(requested);automatic=false;};
 $('#mm-subject').onchange=()=>{requested='';overview=false;journey.options();draw();};let timer;$('#mm-search').oninput=()=>{requested='';overview=false;clearTimeout(timer);timer=setTimeout(draw,180);};journey.options();draw();journey.bind(draw,detail,()=>mapView,view=>{mapView=view;});
 $('#mm-in').onclick=()=>mapView.zoom(1.25);$('#mm-out').onclick=()=>mapView.zoom(.8);$('#mm-fit').onclick=()=>{requested='';overview=false;draw();};
}

let loading=false;
async function refresh(){if(loading)return;loading=true;try{for(const base of ['data/','../data/']){try{const response=await fetch(base+'essay_civil_v2.json',{cache:'no-store'});if(!response.ok)throw Error('資料檔無法讀取');const next=normalize(await response.json());if(!next.questions.length&&!next.packs.length&&!next.articles.length)continue;let stored=true;try{localStorage.setItem('lawu-civil-v2-essay-data',JSON.stringify(next));}catch(e){stored=false;}const changed=JSON.stringify(data)!==JSON.stringify(next);data=next;source=stored?'真實資料｜已儲存，可離線閱讀':'真實資料｜儲存空間不足，本次可閱讀';if(changed)render();return;}catch(e){if(data!==DEMO)source='真實資料｜目前使用離線副本';else if(navigator.onLine!==false)source='示範資料｜等待正式資料，或資料格式尚待確認';}}}finally{loading=false;$('#status').textContent=source;}}
render();refresh();setInterval(refresh,15000);window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
// Classic is online-only; no service worker registration.
</script></html>
