<title>LEXO</title>
<meta http-equiv="refresh" content="0; url=index.html#/essay">
<script>
// The essay pages now live inside the app; send old links to the matching screen.
(function () {
  var h = location.hash.slice(1), m = h.match(/^(question|article|pack)\/(.+)$/), map = {question: 'q', article: 'a', pack: 'g'};
  var to = m ? map[m[1]] + '/' + m[2] : h.indexOf('mindmap') === 0 ? 'map' : 'essay';
  location.replace('index.html#/' + to);
})();
</script>
</head>
