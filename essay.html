<!doctype html>
<html lang="zh-Hant-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071726"><title>申論法條組合包｜法學宇宙</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"PingFang TC",sans-serif;background:#07111e;color:#e3edf5}*{box-sizing:border-box}body{margin:0}a{color:#8fe2ef;text-decoration:none}button,input,select{font:inherit}button,a.card{cursor:pointer}header{background:#102436;border-bottom:1px solid #294153;padding:calc(16px + env(safe-area-inset-top)) 18px 14px}header>div,main{max-width:800px;margin:auto}h1{font-size:23px;margin:18px 0 8px}h2{font-size:20px}h3{font-size:17px;color:#b9eef4}p,li{line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.muted,small{color:#a6b8c9}.status{font-size:13px;color:#ffd38d;line-height:1.6;margin-top:10px}nav{display:flex;gap:8px;margin:18px 0 0;flex-wrap:wrap}nav a,button,.pill{border:1px solid #35566c;border-radius:10px;padding:11px 14px;background:#102b3d;color:#dff8ff;display:inline-block}nav a[aria-current=page]{background:#a9edf0;color:#102436}main{padding:18px 16px calc(32px + env(safe-area-inset-bottom))}.card,section{display:block;background:#102031;border:1px solid #2b4357;border-radius:14px;padding:17px;margin:12px 0;color:inherit}.card:hover{border-color:#86d9e5}.card strong{display:block;font-size:18px;margin:7px 0}.card span{color:#a6b8c9;font-size:14px}.flow{color:#9de0e9;font-size:14px;line-height:1.7}.links{display:flex;flex-wrap:wrap;gap:8px}.links a{border:1px solid #396075;border-radius:8px;padding:10px}input{width:100%;padding:14px;background:#0b1b2b;color:#fff;border:1px solid #496578;border-radius:10px;margin:10px 0}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffd38d;outline-offset:3px}.back{display:inline-block;margin:8px 0}.empty{padding:24px;color:#a6b8c9}h2:focus{outline:none}@media(max-width:400px){nav a{padding:11px 10px;font-size:14px}h1{font-size:22px}}
.mm-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.mm-controls select{min-width:0;max-width:100%;padding:12px;background:#102b3d;color:white;border-radius:8px}.mm-stage{height:65vh;min-height:400px;border:1px solid #496578;border-radius:12px;overflow:hidden;touch-action:none;background:#091725}.mm-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}body:has(.mm-layout) main{max-width:1300px}#mm-detail{max-height:65vh;overflow:auto;padding:12px;border:1px solid #35566c;border-radius:12px;min-width:0}#mm-detail h2{font-size:18px}.mm-controls input{width:240px;margin:0}@media(max-width:760px){.mm-layout{grid-template-columns:1fr}#mm-detail{max-height:50vh}.mm-stage{height:60vh;min-height:360px}}.mm-stage svg{display:block;user-select:none}.mm-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:17px}.mm-legend span{padding:8px;border-radius:6px}.mm-stage [role=button]:focus rect{stroke:#ffd38d;stroke-width:4}
</style>
<header><div><a href="index.html">← 法學宇宙首頁</a><h1>申論法條組合包</h1><div class="muted">從題目抓爭點，把法條串成解題路徑。</div><div id="status" class="status" role="status"></div><nav aria-label="模組導覽"><a href="#questions">題目列表</a><a href="#packs">組合包</a><a href="#reverse">條號反查</a><a href="#mindmap">神經元網路</a></nav></div></header><main id="main"></main>
<script src="vendor/mindmap.js" integrity="sha384-UfMs8Q5vEGeazE3FuNc+md/iSCz+Gemoc4qSc+9i2CHnTQhKU9m2PFQf+YVPOmeM" crossorigin="anonymous"></script>
<script>
'use strict';
const DEMO={questions:[{id:'demo-q1',title:'一物二賣的請求權分析（示範）',subject:'民法',content:'【介面示範，非正式考題】甲將物品出售給乙，嗣後又交付給丙。乙可以如何主張權利？',issues:[{title:'契約義務與不履行',description:'先辨識契約義務，再依給付障礙與可歸責性分析。',articleIds:['demo-a1','demo-a2']}],packIds:['demo-p1']}],packs:[{id:'demo-p1',title:'買賣與給付障礙（示範）',description:'練習從契約義務連結損害賠償。',articleIds:['demo-a1','demo-a2'],questionIds:['demo-q1']}],articles:[{id:'demo-a1',law:'民法',number:'348',title:'出賣人義務',text:'【示範摘要，非條文全文】出賣人負有交付標的物及移轉所有權等義務。',requirements:['辨識契約當事人','確認約定的給付內容'],practice:['示範欄位：正式實務見解待資料完成後載入。'],issues:['債權契約與物權變動的區分'],relatedArticleIds:['demo-a2']},{id:'demo-a2',law:'民法',number:'226',title:'給付不能',text:'【示範摘要，非條文全文】因可歸責於債務人之事由致給付不能時，涉及損害賠償。',requirements:['給付不能','可歸責事由','損害及因果關係'],practice:[],issues:['給付不能與其他給付障礙的區別'],relatedArticleIds:['demo-a1']}]};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), arr=v=>v==null?[]:Array.isArray(v)?v:[v];
const pick=(o,...keys)=>keys.map(k=>o[k]).find(v=>v!=null), refs=(o,type)=>arr(pick(o,type+'Ids',type.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())+'_ids',type+'s',type.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())+'s')).map(v=>String(typeof v==='object'?v.id:v));
function normalize(raw){if(!raw||!['questions','packs','articles'].every(k=>Array.isArray(raw[k])))throw Error('需要 questions、packs、articles 三個陣列');const d={};for(const k of ['questions','packs','articles']){d[k]=raw[k].map((v,i)=>({...v,id:String(v.id??k+'-'+i)}));if(new Set(d[k].map(v=>v.id)).size!==d[k].length)throw Error('資料 ID 重複');}return d;}
let data=DEMO,source='示範資料｜正式資料尚未完成',search='';
try{const saved=JSON.parse(localStorage.getItem('lawu-essay-data'));if(saved){data=normalize(saved);source='真實資料｜使用已儲存的離線副本';}}catch(e){}
const title=o=>pick(o,'title','name','label')||o.id;
const label=a=>[pick(a,'law','lawName','law_name'),pick(a,'number','articleNumber','article_number','articleNo')?`第 ${pick(a,'number','articleNumber','article_number','articleNo')} 條`:'',title(a)].filter(Boolean).join(' · ');
function link(kind,id,text){return `<a href="#${kind}/${encodeURIComponent(id)}">${esc(text)}</a>`;}
function articleLinks(ids){return `<div class="links">${ids.length?ids.map(id=>{const a=data.articles.find(a=>a.id===id);return link('article',id,a?label(a):id+'（資料未提供）');}).join(''):'<span class="muted">尚無關聯條文</span>'}</div>`;}
function issueArticles(q){return [...new Set([...refs(q,'article'),...arr(q.issues).flatMap(i=>typeof i==='object'?refs(i,'article'):[])])];}
function questionArticles(q){return [...new Set([...issueArticles(q),...data.packs.filter(p=>refs(q,'pack').includes(p.id)||refs(p,'question').includes(q.id)).flatMap(p=>refs(p,'article'))])];}
function usedQuestions(a){return data.questions.filter(q=>questionArticles(q).includes(a.id)||refs(a,'question').includes(q.id));}
function usedPacks(a){return data.packs.filter(p=>refs(p,'article').includes(a.id)||refs(a,'pack').includes(p.id));}
function text(v){if(v==null||arr(v).length===0)return '<p class="muted">尚未提供</p>';return arr(v).map(x=>`<p>${esc(typeof x==='object'?Object.entries(x).map(([k,v])=>`${k}：${typeof v==='object'?JSON.stringify(v):v}`).join('\n'):x)}</p>`).join('');}
function cards(items,kind){return items.length?items.map(o=>`<a class="card" href="#${kind}/${encodeURIComponent(o.id)}"><span>${esc(o.subject||o.category||'申論練習')}</span><strong>${esc(kind==='article'?label(o):title(o))}</strong><span>${esc(o.description||o.summary||'查看內容與關聯')}</span></a>`).join(''):'<p class="empty">目前沒有符合的資料。</p>';}
function block(heading,body){return `<section><h3>${heading}</h3>${body}</section>`;}
let mapView=null;
function render(){mapView?.destroy();mapView=null;const [page='questions',encoded='']=location.hash.slice(1).split('/');let id;try{id=decodeURIComponent(encoded);}catch(e){id='';}let html='';for(const a of document.querySelectorAll('nav a'))a.setAttribute('aria-current',a.hash==='#'+page?'page':'false');
if(page==='mindmap'){renderMindmap(id);$('#status').textContent=source;return;}
if(page==='questions'){html=`<h2 tabindex="-1">題目列表</h2><p class="flow">題目 → 爭點 → 法條 → 關聯法條</p><label for="search">搜尋題目、科目與內容</label><input id="search" type="search" value="${esc(search)}" placeholder="輸入關鍵字"><div id="results">${cards(data.questions.filter(q=>JSON.stringify(q).toLowerCase().includes(search.toLowerCase())),'question')}</div>`;}
else if(page==='packs'){html='<h2 tabindex="-1">組合包列表</h2>'+cards(data.packs,'pack');}
else if(page==='reverse'){html=`<h2 tabindex="-1">條號反查</h2><p class="muted">選一條法條，查看哪些題目與組合包使用它。</p><label for="search">搜尋法規、條號或關鍵字</label><input id="search" type="search" value="${esc(search)}" placeholder="例如：民法、348"><div id="results">${reverseResults()}</div>`;}
else {const collection={question:'questions',pack:'packs',article:'articles'}[page],o=collection&&data[collection].find(x=>x.id===id);if(!o)html='<h2 tabindex="-1">找不到這筆資料</h2><a href="#questions">返回題目列表</a>';else if(page==='question'){html=`<a class="back" href="#questions">← 題目列表</a><h2 tabindex="-1">${esc(title(o))}</h2><p class="flow">① 題目 → ② 爭點 → ③ 法條 → ④ 關聯法條</p>${block('① 題目',text(pick(o,'content','question','text','body','stem_text'))+text(o.prompt_text))}${block('② 爭點',arr(o.issues).map((i,n)=>`<h3>${n+1}. ${esc(typeof i==='string'?i:pick(i,'title','name','issue')||'爭點')}</h3>${typeof i==='object'?text(pick(i,'description','analysis','content'))+articleLinks(refs(i,'article')):''}`).join('')||text(null))}${block('③ 適用法條',articleLinks(questionArticles(o)))}${block('④ 關聯法條',articleLinks([...new Set(data.articles.filter(a=>questionArticles(o).includes(a.id)).flatMap(a=>refs(a,'relatedArticle')))]))}`;}
else if(page==='pack'){const qs=data.questions.filter(q=>refs(o,'question').includes(q.id)||refs(q,'pack').includes(o.id));html=`<a class="back" href="#packs">← 組合包列表</a><h2 tabindex="-1">${esc(title(o))}</h2>${text(o.description)}${block('組合法條',articleLinks(refs(o,'article')))}${block('練習題目',cards(qs,'question'))}`;}
else{html=`<a class="back" href="#reverse">← 條號反查</a><h2 tabindex="-1">${esc(label(o))}</h2>${block('條文',text(pick(o,'text','content','fullText','full_text')))}${block('要件',text(pick(o,'requirements','elements','plain_requirements')))}${block('實務見解',text(pick(o,'practice','opinions','cases','judicialOpinions')))}${block('常考爭點',text(pick(o,'issues','commonIssues','common_issues')))}${block('關聯條文',articleLinks(refs(o,'relatedArticle')))}${block('反查：哪些題目用到這一條',cards(usedQuestions(o),'question'))}${block('反查：哪些組合包用到這一條',cards(usedPacks(o),'pack'))}`;}}
if(['question','pack','article'].includes(page)&&id)html+=`<p>${link('mindmap',page+':'+id,'以此為中心開啟神經元網路')}</p>`;$('#main').innerHTML=html;$('#status').textContent=source;const input=$('#search');if(input)input.oninput=()=>{search=input.value;$('#results').innerHTML=page==='reverse'?reverseResults():cards(data.questions.filter(q=>JSON.stringify(q).toLowerCase().includes(search.toLowerCase())),'question');};}
function reverseResults(){return data.articles.filter(a=>JSON.stringify(a).toLowerCase().includes(search.toLowerCase())).map(a=>`<a class="card" href="#article/${encodeURIComponent(a.id)}"><strong>${esc(label(a))}</strong><span>${usedQuestions(a).length} 題目 · ${usedPacks(a).length} 組合包</span></a>`).join('')||'<p class="empty">找不到符合的法條。</p>';}
window.addEventListener('hashchange',()=>{search='';render();window.scrollTo(0,0);$('#main h2')?.focus();});

function mapGraph(){
 const nodes=[],edges=[],seen=new Map(),pairs=new Set();
 const add=(kind,obj)=>{const key=kind+':'+obj.id;if(!seen.has(key)){const n={key,kind,id:obj.id,obj,label:kind==='article'?label(obj):title(obj)};seen.set(key,n);nodes.push(n);}return key;};
 const edge=(a,b)=>{if(a===b||!seen.has(a)||!seen.has(b))return;const key=[a,b].sort().join('|');if(!pairs.has(key)){pairs.add(key);edges.push([a,b]);}};
 data.questions.forEach(o=>add('question',o));data.packs.forEach(o=>add('pack',o));data.articles.forEach(o=>add('article',o));
 data.questions.forEach(q=>{arr(q.issues).forEach((i,index)=>{const obj=typeof i==='string'?{title:i}:i;const key=add('issue',{...obj,id:q.id+':'+index,category:q.category});edge('question:'+q.id,key);[...refs(obj,'article'),...refs(obj,'relatedArticle')].forEach(id=>edge(key,'article:'+id));});questionArticles(q).forEach(id=>edge('question:'+q.id,'article:'+id));refs(q,'pack').forEach(id=>edge('question:'+q.id,'pack:'+id));});
 data.packs.forEach(p=>{refs(p,'article').forEach(id=>edge('pack:'+p.id,'article:'+id));refs(p,'question').forEach(id=>edge('pack:'+p.id,'question:'+id));});
 data.articles.forEach(a=>{refs(a,'relatedArticle').forEach(id=>edge('article:'+a.id,'article:'+id));refs(a,'question').forEach(id=>edge('article:'+a.id,'question:'+id));refs(a,'pack').forEach(id=>edge('article:'+a.id,'pack:'+id));});
 return {nodes,edges};
}
function mapDetails(n){
 if(n.kind==='issue')return `<h3>${esc(n.label)}</h3>${text(pick(n.obj,'description','analysis','content'))}${articleLinks([...refs(n.obj,'article'),...refs(n.obj,'relatedArticle')])}`;
 // Reuse the full detail renderer in a detached container, then restore the network.
 const main=$('#main'),saved=document.createElement('div'),view=mapView,hash=location.hash;
 while(main.firstChild)saved.append(main.firstChild);
 mapView=null;history.replaceState(null,'','#'+n.kind+'/'+encodeURIComponent(n.id));render();
 const html=main.innerHTML;main.replaceChildren(...saved.childNodes);history.replaceState(null,'',hash);mapView=view;document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#mindmap'?'page':'false'));
 return html;
}
function renderMindmap(requested){
 const graph=mapGraph();
 $('#main').innerHTML=`<h2 tabindex="-1">神經元網路</h2><p>點選亮起直接連結，雙擊展開／收合第二層。拖曳細胞移動，空白處平移，雙指或滾輪縮放。</p><div class="mm-legend"><span style="color:#63ccff">● 題目</span><span style="color:#ffc86a">● 爭點</span><span style="color:#65efb2">● 法條</span><span style="color:#c49aff">● 組合包</span></div><div class="mm-controls"><label>科目 <select id="mm-subject"><option value="">全部</option><option>民法總則</option><option>物權</option><option>刑法總則</option></select></label><label for="mm-search">搜尋節點</label><input type="search" id="mm-search" placeholder="題目、爭點、條號或關鍵字"></div><div class="mm-controls"><button id="mm-in">＋</button><button id="mm-out">－</button><button id="mm-fit">顯示全網路</button></div><p id="mm-count" aria-live="polite"></p><div class="mm-layout"><div class="mm-stage" id="mm-stage"></div><aside id="mm-detail" aria-live="polite"><p>選取節點，查看詳細資料。</p></aside></div>`;
 const detail=n=>{$('#mm-detail').innerHTML=mapDetails(n);};
 const draw=()=>{mapView?.destroy();const subject=$('#mm-subject').value,query=$('#mm-search').value.trim().toLowerCase();let active=new Set(graph.nodes.filter(n=>(!subject||String(n.obj.category||'').includes(subject)||subject==='物權'&&String(n.obj.category||'').includes('物權'))&&(!query||JSON.stringify(n.obj).toLowerCase().includes(query))).map(n=>n.key));
 if(subject||query){const seed=new Set(active);graph.edges.forEach(([a,b])=>{if(seed.has(a))active.add(b);if(seed.has(b))active.add(a);});}
 const g={nodes:graph.nodes.filter(n=>active.has(n.key)),edges:graph.edges.filter(([a,b])=>active.has(a)&&active.has(b))};$('#mm-count').textContent=`${g.nodes.length} 個節點 · ${g.edges.length} 條連線（全部 ${graph.nodes.length} 節點）`;mapView=window.LawMindmap.mount($('#mm-stage'),g,detail);if(requested)mapView.select(requested);};
 $('#mm-subject').onchange=draw;let timer;$('#mm-search').oninput=()=>{clearTimeout(timer);timer=setTimeout(draw,180);};draw();
 $('#mm-in').onclick=()=>mapView.zoom(1.25);$('#mm-out').onclick=()=>mapView.zoom(.8);$('#mm-fit').onclick=()=>{mapView.reset();$('#mm-detail').innerHTML='<p>選取節點，查看詳細資料。</p>';};
}

let loading=false;
async function refresh(){if(loading)return;loading=true;try{for(const base of ['data/','../data/']){try{const response=await fetch(base+'essay_packs.json',{cache:'no-store'});if(!response.ok)throw Error('資料檔無法讀取');const next=normalize(await response.json());if(!next.questions.length&&!next.packs.length&&!next.articles.length)continue;let stored=true;try{localStorage.setItem('lawu-essay-data',JSON.stringify(next));}catch(e){stored=false;}const changed=JSON.stringify(data)!==JSON.stringify(next);data=next;source=stored?'真實資料｜已儲存，可離線閱讀':'真實資料｜儲存空間不足，本次可閱讀';if(changed)render();return;}catch(e){if(data!==DEMO)source='真實資料｜目前使用離線副本';else if(navigator.onLine!==false)source='示範資料｜等待正式資料，或資料格式尚待確認';}}}finally{loading=false;$('#status').textContent=source;}}
render();refresh();setInterval(refresh,15000);window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{source+='｜離線快取註冊失敗';$('#status').textContent=source;});
</script></html>
